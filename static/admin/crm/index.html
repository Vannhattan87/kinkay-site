<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#faf7f2">
<title>KINKAY CRM</title>
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/assets/fonts/fonts.css">
<!--
  KINKAY CRM · v1.0 MVP · 06/09/2026 · CR-20260906-28
  Một file, không framework, mobile-first. Dữ liệu ở Cloudflare D1 qua /api/crm/*.
  Đăng nhập: dùng lại popup OAuth GitHub của Sveltia CMS (kinkay-site.pages.dev/auth). Ai đăng bài được thì dùng CRM được.
  /admin/* đã có X-Frame-Options DENY + no-store + noindex trong static/_headers, không có CSP (cố ý, xem _headers).
-->
<style>
  :root{--bg:#faf7f2;--card:#fff;--ink:#2a2622;--mute:#7b736a;--line:#e9e2d8;--gold:#b8975a;--gold2:#8f7340;--red:#c0392b;--green:#2e7d4f;--blue:#2c5f8a;--amber:#b7791f;--r:14px}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Be Vietnam Pro","Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
  a{color:var(--gold2)}
  #app{max-width:720px;margin:0 auto;padding:12px 12px calc(84px + env(safe-area-inset-bottom))}
  header.top{display:flex;align-items:center;justify-content:space-between;padding:6px 2px 10px}
  header.top h1{font:600 18px/1 "Playfair Display",Georgia,serif;letter-spacing:.06em;margin:0}
  header.top small{color:var(--mute);font-size:12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin:0 0 10px}
  .card h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:0 0 8px;display:flex;justify-content:space-between;align-items:center}
  .card h2 b{color:var(--ink);font-weight:600}
  .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px}
  .kpi .v{font-size:18px;font-weight:600;line-height:1.1}
  .kpi .l{font-size:11px;color:var(--mute);margin-top:4px}
  .row{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
  .row:first-of-type{border-top:0}
  .row .main{flex:1;min-width:0}
  .row .t{font-weight:600}
  .row .s{font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .right{text-align:right;font-size:12px;color:var(--mute);white-space:nowrap}
  .pill{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);background:#f4efe7;color:var(--ink);white-space:nowrap}
  .pill.New{background:#eef4fb;color:var(--blue);border-color:#d6e4f2}
  .pill.Quoted,.pill.Qualified,.pill.Contacted,.pill.Waiting\ for\ Response,.pill.Hold{background:#fbf3e4;color:var(--amber);border-color:#f0dfbf}
  .pill.Deposit\ Paid,.pill.Confirmed{background:#e9f5ee;color:var(--green);border-color:#cfe8d9}
  .pill.Completed{background:#eee;color:#555}
  .pill.Lost{background:#fbeaea;color:var(--red);border-color:#f2cfcf}
  .pill.due{background:#fbf3e4;color:var(--amber)}
  .pill.over{background:#fbeaea;color:var(--red)}
  .empty{color:var(--mute);font-size:14px;padding:6px 0}
  .chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;-webkit-overflow-scrolling:touch}
  .chips button{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px;color:var(--ink)}
  .chips button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  label{display:block;font-size:12px;color:var(--mute);margin:10px 0 4px}
  input,select,textarea{width:100%;font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
  textarea{min-height:72px;resize:vertical}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font:inherit;font-size:15px;font-weight:600;padding:12px 16px;border-radius:12px;border:1px solid var(--gold);background:var(--gold);color:#fff;width:100%;margin-top:12px;cursor:pointer}
  .btn.sec{background:#fff;color:var(--ink);border-color:var(--line);font-weight:500}
  .btn.sm{width:auto;padding:8px 12px;font-size:13px;margin:0}
  .btn:disabled{opacity:.5}
  .quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
  .quick button{font:inherit;font-size:13px;padding:6px 10px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--ink)}
  .quick button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 0 calc(6px + env(safe-area-inset-bottom));z-index:5}
  .bar a{flex:1;text-align:center;text-decoration:none;color:var(--mute);font-size:11px;padding:4px 0}
  .bar a span{display:block;font-size:20px;line-height:1.1}
  .bar a.on{color:var(--gold2);font-weight:600}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom));background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;z-index:9;pointer-events:none;max-width:90%}
  .toast.on{opacity:1}
  .toast.err{background:var(--red)}
  .hist{font-size:12px;color:var(--mute)}
  .hist div{padding:4px 0;border-top:1px dashed var(--line)}
  .money{font-variant-numeric:tabular-nums}
  .back{background:none;border:0;font:inherit;color:var(--gold2);padding:0;margin:0 0 8px;cursor:pointer}
  .warn{background:#fbf3e4;border:1px solid #f0dfbf;color:#6b4a0b;border-radius:10px;padding:8px 10px;font-size:13px;margin:8px 0}
  .login{max-width:360px;margin:15vh auto;text-align:center}
  .login h1{font:600 26px "Playfair Display",Georgia,serif;letter-spacing:.1em}
  .muted{color:var(--mute);font-size:13px}
  details summary{cursor:pointer;color:var(--gold2);font-size:14px;margin:10px 0 4px}
  /* Booking Confirmation (CR-29) */
  .btn.bc{background:#1A0F08;border-color:#1A0F08;color:#FAF0E4;letter-spacing:.02em}
  .btn.bc.soft{background:#fff;color:#1A0F08;border-color:#C4A882}
  .sheet-bg{position:fixed;inset:0;background:rgba(26,15,8,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
  .sheet{background:var(--bg);width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:14px 16px calc(16px + env(safe-area-inset-bottom));box-shadow:0 -8px 30px rgba(0,0,0,.2)}
  .sheet h3{margin:4px 0 2px;font:600 17px "Playfair Display",Georgia,serif}
  .sheet .grab{width:38px;height:4px;border-radius:2px;background:#d9cfc2;margin:0 auto 8px}
  .miss{color:var(--red);font-size:12px}
  .bcprev{background:#e9e2d8;border-radius:14px;padding:10px;display:flex;justify-content:center}
  .bcprev canvas{width:100%;max-width:420px;height:auto;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.18);display:block}
  .bcbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
  .bcbtns .btn{margin:0}
  .seg{display:flex;gap:6px}
  .seg button{flex:1;font:inherit;font-size:13px;padding:9px 6px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink)}
  .seg button.on{background:#1A0F08;color:#FAF0E4;border-color:#1A0F08}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

<script>
(function () {
  'use strict';
  var API = '/api/crm';
  var AUTH_BASE = 'https://kinkay-site.pages.dev';   // trùng base_url trong static/admin/config.yml
  var TOKEN_KEY = 'kk_crm_token';
  var app = document.getElementById('app');
  var state = { token: null, lists: null, user: null, dev: false, cutover: false, route: '#/today', filter: '', q: '', pfilter: '' };

  // ---------- helpers ----------
  function $(sel, root) { return (root || document).querySelector(sel); }
  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function money(v) { if (v == null || v === '') return '—'; return Number(v).toLocaleString('vi-VN') + ' ₫'; }
  function dmy(iso) { if (!iso) return ''; var p = String(iso).slice(0, 10).split('-'); return p.length === 3 ? p[2] + '/' + p[1] + '/' + p[0] : iso; }
  function todayVN() { return new Date(Date.now() + 7 * 3600e3).toISOString().slice(0, 10); }
  function addDays(iso, n) { var d = new Date(Date.parse(iso || todayVN()) + n * 86400e3); return d.toISOString().slice(0, 10); }
  var toastT;
  function toast(msg, isErr) { var t = $('#toast'); t.textContent = msg; t.className = 'toast on' + (isErr ? ' err' : ''); clearTimeout(toastT); toastT = setTimeout(function () { t.className = 'toast'; }, isErr ? 4000 : 2000); }
  function opts(list, cur, allowEmpty) { var h = allowEmpty ? '<option value="">—</option>' : ''; (list || []).forEach(function (o) { h += '<option' + (o === cur ? ' selected' : '') + '>' + esc(o) + '</option>'; }); return h; }
  function pill(s, extra) { return '<span class="pill ' + esc(s) + (extra ? ' ' + extra : '') + '">' + esc(s) + '</span>'; }
  function dueClass(iso, today) { if (!iso) return ''; return iso < today ? 'over' : (iso === today ? 'due' : ''); }

  function api(path, opt) {
    opt = opt || {};
    var h = { 'Content-Type': 'application/json' };
    if (state.token) h.Authorization = 'Bearer ' + state.token;
    return fetch(API + path, { method: opt.method || 'GET', headers: h, body: opt.body ? JSON.stringify(opt.body) : undefined })
      .then(function (r) {
        if (r.status === 401) { logout(false); throw new Error('Phiên đăng nhập hết hạn, đăng nhập lại.'); }
        return r.json().then(function (j) { if (!r.ok || j.ok === false) throw new Error((j && j.error) ? j.error + (j.detail ? ' · ' + (Array.isArray(j.detail) ? j.detail.join('; ') : j.detail) : '') : 'Lỗi ' + r.status); return j; });
      });
  }

  // ---------- auth ----------
  function login() {
    var popup = window.open(AUTH_BASE + '/auth?provider=github&site_id=' + encodeURIComponent(location.hostname), 'kk_auth', 'width=600,height=700');
    if (!popup) { toast('Trình duyệt chặn popup. Cho phép popup rồi thử lại.', true); return; }
    function onMsg(e) {
      if (e.origin !== AUTH_BASE) return;
      if (e.data === 'authorizing:github') { e.source.postMessage('authorizing:github', e.origin); return; }
      if (typeof e.data === 'string' && e.data.indexOf('authorization:github:') === 0) {
        window.removeEventListener('message', onMsg);
        var m = e.data.match(/^authorization:github:(success|error):(.+)$/);
        try { var payload = JSON.parse(m[2]); } catch (x) { payload = {}; }
        if (m[1] === 'success' && payload.token) {
          state.token = payload.token; try { localStorage.setItem(TOKEN_KEY, payload.token); } catch (x) { }
          boot();
        } else toast('Đăng nhập không thành công: ' + (payload.error || ''), true);
        try { popup.close(); } catch (x) { }
      }
    }
    window.addEventListener('message', onMsg);
  }
  function logout(clear) { state.token = null; state.user = null; try { localStorage.removeItem(TOKEN_KEY); } catch (x) { } if (clear !== false) render(); else renderLogin(); }

  function renderLogin(msg) {
    app.innerHTML = '<div class="login"><h1>KINKAY</h1><p class="muted">CRM · sổ khách của Kay</p>' +
      (msg ? '<div class="warn">' + esc(msg) + '</div>' : '') +
      '<button class="btn" id="btnLogin">Đăng nhập bằng GitHub (tài khoản đăng bài)</button>' +
      '<p class="muted" style="margin-top:14px">Dùng đúng tài khoản đang đăng bài trên <a href="/admin/">/admin/</a>. Không có tài khoản riêng.</p></div>';
    $('#btnLogin').onclick = login;
  }

  function boot() {
    try { if (!state.token) state.token = localStorage.getItem(TOKEN_KEY); } catch (x) { }
    api('/lists').then(function (j) {
      state.lists = j; state.user = j.user; state.dev = !state.token; state.cutover = !!j.cutover;
      if (!location.hash) location.hash = '#/today';
      render();
    }).catch(function (e) {
      state.token = null;
      renderLogin(/hết hạn|401|Chưa đăng nhập/.test(e.message) ? '' : e.message);
    });
  }

  // ---------- layout ----------
  function shell(title, inner, tab) {
    app.innerHTML =
      '<header class="top"><h1>KINKAY · CRM</h1><small>' + esc(state.user || '') + ' · ' + dmy(todayVN()) + '</small></header>' +
      (state.cutover ? '' : '<div class="warn"><b>Chế độ CHỈ ĐỌC (đang đối chiếu).</b> Google Sheet LIVE vẫn là nguồn duy nhất. Kay tiếp tục ghi vào Sheet. Tân bật CRM_CUTOVER=1 khi đối chiếu xong.</div>') + inner +
      '<nav class="bar">' +
      '<a href="#/today" class="' + (tab === 'today' ? 'on' : '') + '"><span>☀️</span>Hôm nay</a>' +
      '<a href="#/leads" class="' + (tab === 'leads' ? 'on' : '') + '"><span>👥</span>Khách</a>' +
      '<a href="#/new" class="' + (tab === 'new' ? 'on' : '') + '"><span>➕</span>Thêm</a>' +
      '<a href="#/partners" class="' + (tab === 'partners' ? 'on' : '') + '"><span>🤝</span>Đối tác</a>' +
      '<a href="#/more" class="' + (tab === 'more' ? 'on' : '') + '"><span>⋯</span>Thêm</a></nav>';
  }
  function loading(tab) { shell('', '<div class="empty">Đang tải…</div>', tab); }

  function leadRow(l, today) {
    var due = l.next_followup ? '<span class="pill ' + dueClass(l.next_followup, today) + '">' + dmy(l.next_followup) + '</span>' : '';
    return '<div class="row" data-go="#/lead/' + esc(l.id) + '"><div class="main"><div class="t">' + esc(l.customer_name) + ' ' + pill(l.status) + '</div>' +
      '<div class="s">' + esc([l.service, l.event_date ? 'sự kiện ' + dmy(l.event_date) : '', l.next_action].filter(Boolean).join(' · ')) + '</div></div>' +
      '<div class="right">' + due + (l.expected_revenue != null ? '<div class="money">' + esc(money(l.expected_revenue)) + '</div>' : '') + '</div></div>';
  }
  function partnerRow(p, today) {
    var due = p.next_followup ? '<span class="pill ' + dueClass(p.next_followup, today) + '">' + dmy(p.next_followup) + '</span>' : '';
    return '<div class="row" data-go="#/partner/' + esc(p.id) + '"><div class="main"><div class="t">' + esc(p.name) + ' <span class="pill">' + esc(p.status) + '</span></div>' +
      '<div class="s">' + esc([p.type, p.next_action].filter(Boolean).join(' · ')) + '</div></div><div class="right">' + due + '</div></div>';
  }
  function section(title, rows, emptyMsg) {
    return '<div class="card"><h2>' + title + '<b>' + rows.length + '</b></h2>' + (rows.length ? rows.join('') : '<div class="empty">' + (emptyMsg || 'Không có') + '</div>') + '</div>';
  }
  function bindRows() { app.querySelectorAll('[data-go]').forEach(function (el) { el.addEventListener('click', function () { location.hash = el.getAttribute('data-go'); }); }); }

  // ---------- views ----------
  function viewToday() {
    loading('today');
    api('/dashboard').then(function (d) {
      var t = d.today, k = d.kpi, q = d.queues;
      var kpis = '<div class="kpis">' +
        '<div class="kpi"><div class="v money">' + esc(money(k.expected_revenue_open)) + '</div><div class="l">Expected (đang mở, ' + k.expected_open_count + ' lead)</div></div>' +
        '<div class="kpi"><div class="v money">' + esc(money(k.verified_actual_revenue)) + '</div><div class="l">Actual đã xác minh (' + k.verified_count + ')</div></div>' +
        '<div class="kpi"><div class="v money">' + esc(money(k.completed_unverified_expected)) + '</div><div class="l">Completed chưa xác minh tiền (' + k.completed_unverified_count + ')</div></div></div>' +
        '<div class="kpis"><div class="kpi"><div class="v">' + k.total_leads + '</div><div class="l">Tổng lead</div></div>' +
        '<div class="kpi"><div class="v">' + k.bookings + '</div><div class="l">Booking (cọc/chốt/xong)</div></div>' +
        '<div class="kpi"><div class="v">' + (k.booking_conversion == null ? '—' : k.booking_conversion + '%') + '</div><div class="l">Booked / qualified+</div></div></div>';
      var html = kpis +
        section('Đến hạn hôm nay', q.due_today.map(function (l) { return leadRow(l, t); }), 'Không có việc đến hạn') +
        section('Quá hạn', q.overdue.map(function (l) { return leadRow(l, t); }), 'Sạch') +
        section('Khách mới (New)', q.new_leads.map(function (l) { return leadRow(l, t); })) +
        section('Đang báo giá / chờ', q.quoted.map(function (l) { return leadRow(l, t); })) +
        section('Đã cọc / đã chốt', q.booked.map(function (l) { return leadRow(l, t); })) +
        section('Job 30 ngày tới', q.upcoming_30d.map(function (l) { return leadRow(l, t); })) +
        section('Completed cần thu tiền / xin review', q.completed_followup.map(function (l) { return leadRow(l, t); })) +
        section('Đối tác đến hạn', q.partners_due.map(function (p) { return partnerRow(p, t); })) +
        '<div class="card"><h2>Nguồn khách</h2>' + d.sources.map(function (s) { return '<div class="row" style="cursor:default"><div class="main">' + esc(s.k) + '</div><div class="right">' + s.n + '</div></div>'; }).join('') + '</div>' +
        '<div class="card"><h2>Dịch vụ</h2>' + d.services.map(function (s) { return '<div class="row" style="cursor:default"><div class="main">' + esc(s.k) + '</div><div class="right">' + s.n + '</div></div>'; }).join('') + '</div>' +
        (d.meta && d.meta.seed_source ? '<p class="muted">Dữ liệu gốc: ' + esc(d.meta.seed_source) + '</p>' : '');
      shell('', html, 'today'); bindRows();
    }).catch(function (e) { shell('', '<div class="warn">' + esc(e.message) + '</div>', 'today'); });
  }

  function viewLeads() {
    loading('leads');
    var qs = '?limit=300' + (state.filter ? '&status=' + encodeURIComponent(state.filter) : '') + (state.q ? '&q=' + encodeURIComponent(state.q) : '');
    api('/leads' + qs).then(function (d) {
      var chips = ['', 'New', 'Contacted', 'Qualified', 'Quoted', 'Waiting for Response', 'Hold', 'Deposit Paid', 'Confirmed', 'Completed', 'Lost'];
      var html = '<input id="q" type="search" placeholder="Tìm tên, contact, ghi chú…" value="' + esc(state.q) + '">' +
        '<div class="chips" style="margin-top:8px">' + chips.map(function (c) { return '<button data-f="' + esc(c) + '" class="' + (state.filter === c ? 'on' : '') + '">' + (c || 'Tất cả') + '</button>'; }).join('') + '</div>' +
        '<div class="card">' + (d.leads.length ? d.leads.map(function (l) { return leadRow(l, d.today); }).join('') : '<div class="empty">Không có khách nào</div>') + '</div>';
      shell('', html, 'leads'); bindRows();
      app.querySelectorAll('.chips button').forEach(function (b) { b.onclick = function () { state.filter = b.getAttribute('data-f'); viewLeads(); }; });
      var qi = $('#q'), tm; qi.oninput = function () { clearTimeout(tm); tm = setTimeout(function () { state.q = qi.value.trim(); viewLeads(); }, 350); };
    }).catch(function (e) { shell('', '<div class="warn">' + esc(e.message) + '</div>', 'leads'); });
  }

  function quickDates(fieldId, base) {
    var b = base || todayVN();
    return '<div class="quick">' + [['Mai', 1], ['+2 ngày', 2], ['+3 ngày', 3], ['+7 ngày', 7], ['+14', 14]].map(function (x) {
      return '<button type="button" data-d="' + addDays(b, x[1]) + '" data-for="' + fieldId + '">' + x[0] + '</button>';
    }).join('') + '<button type="button" data-d="" data-for="' + fieldId + '">Xoá hạn</button></div>';
  }
  function bindQuickDates(root) {
    root.querySelectorAll('.quick button[data-for]').forEach(function (b) { b.onclick = function () { var f = $('#' + b.getAttribute('data-for'), root); f.value = b.getAttribute('data-d'); }; });
  }

  function viewLead(id) {
    loading('leads');
    api('/leads/' + encodeURIComponent(id)).then(function (d) {
      var l = d.lead, L = state.lists, today = todayVN();
      var showMoney = ['Quoted', 'Hold', 'Deposit Paid', 'Confirmed', 'Completed'].indexOf(l.status) >= 0;
      var head = '<button class="back" data-go="#/leads">‹ Khách</button>' +
        '<div class="card"><div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start"><div><div style="font-size:18px;font-weight:600">' + esc(l.customer_name) + '</div>' +
        '<div class="muted">' + esc(l.id) + ' · ' + esc(l.contact_channel || '') + ' ' + esc(l.contact || '') + '</div></div>' + pill(l.status) + '</div>' +

    if (need('event_date')) f += '<label>Ngày sự kiện *</label><input id="b_event" type="date" value="' + esc(lead.event_date || '') + '">';
    if (need('ready_time')) f += '<label>Giờ hẹn (giờ cần xong makeup) *</label><input id="b_time" type="time" value="' + esc(booking.ready_time || '') + '">';
    if (need('venue')) f += '<label>Địa điểm *</label><input id="b_venue" value="' + esc(booking.venue || '') + '" placeholder="Tên khách sạn / địa chỉ">';
    var total = booking.total_fee != null ? booking.total_fee : lead.expected_revenue;
    if (need('total_fee')) f += '<label>Tổng phí (đ) *</label><input id="b_total" inputmode="numeric" value="' + (total == null ? '' : total) + '">';
    if (need('deposit_mode') || need('deposit_amount')) {
      var dm = booking.deposit_mode || '';
      f += '<label>Cọc *</label><div class="seg" id="b_dm">' +
        '<button type="button" data-v="amount" class="' + (dm === 'amount' ? 'on' : '') + '">Có cọc (số tiền)</button>' +
        '<button type="button" data-v="none" class="' + (dm === 'none' ? 'on' : '') + '">Không cần cọc</button>' +
        '<button type="button" data-v="na" class="' + (dm === 'na' ? 'on' : '') + '">Không áp dụng</button></div>' +
        '<div id="b_depwrap" style="' + (dm === 'amount' ? '' : 'display:none') + '"><label>Số tiền cọc (đ) *</label><input id="b_dep" inputmode="numeric" value="' + (booking.deposit_amount == null ? '' : booking.deposit_amount) + '"></div>';
    }
    var more = '<details' + (editAll ? ' open' : '') + '><summary>Thêm chi tiết cho khách (tuỳ chọn)</summary>' +
      '<label>Số người</label><input id="b_pax" inputmode="numeric" value="' + (booking.pax == null ? '' : booking.pax) + '" placeholder="Ví dụ: 3">' +
      '<label>Gồm những gì</label><textarea id="b_inc" placeholder="Makeup + làm tóc cô dâu, touch-up 1 lần, đến tận nơi">' + esc(booking.includes || '') + '</textarea>' +
      '<label>Không gồm</label><input id="b_exc" value="' + esc(booking.excludes || '') + '" placeholder="Phụ kiện, lông mi giả cao cấp…">' +
      '<label>Thanh toán</label><input id="b_pay" value="' + esc(booking.payment_terms || '') + '" placeholder="Còn lại thanh toán tiền mặt / chuyển khoản sau khi xong">' +
      '<label>Ghi chú cho khách</label><textarea id="b_note" placeholder="Vui lòng để mặt sạch, không makeup trước">' + esc(booking.customer_note || '') + '</textarea>' +
      '<label>Lưu ý đặc biệt</label><input id="b_spec" value="' + esc(booking.special_instructions || '') + '"></details>';
    var sheet = document.createElement('div'); sheet.className = 'sheet-bg';
    sheet.innerHTML = '<div class="sheet"><div class="grab"></div><h3>' + (editAll ? 'Sửa chi tiết booking' : (f ? 'Điền phần còn thiếu' : 'Xác nhận thông tin')) + '</h3>' +
      '<div class="muted">' + esc(lead.customer_name) + ' · ' + esc(lead.service || '') + (lead.event_date ? ' · ' + dmy(lead.event_date) : '') + '</div>' +
      (f && !editAll ? '<div class="miss" style="margin-top:6px">Chưa đủ để gửi khách. Không tự điền giá trị đoán.</div>' : '') + f + more +
      '<div class="bcbtns"><button class="btn sec" id="b_cancel">Huỷ</button><button class="btn bc" id="b_ok">Tạo bản xem trước</button></div></div>';
    document.body.appendChild(sheet);
    var dmv = booking.deposit_mode || '';
    sheet.querySelectorAll('#b_dm button').forEach(function (b) { b.onclick = function () { dmv = b.getAttribute('data-v'); sheet.querySelectorAll('#b_dm button').forEach(function (x) { x.className = x === b ? 'on' : ''; }); $('#b_depwrap', sheet).style.display = dmv === 'amount' ? '' : 'none'; }; });
    $('#b_cancel', sheet).onclick = function () { sheet.remove(); };
    sheet.addEventListener('click', function (e) { if (e.target === sheet) sheet.remove(); });
    $('#b_ok', sheet).onclick = function () {
      var g = function (id) { var el = $(id, sheet); return el ? el.value.trim() : undefined; };
      var b = { pax: g('#b_pax'), includes: g('#b_inc'), excludes: g('#b_exc'), payment_terms: g('#b_pay'), customer_note: g('#b_note'), special_instructions: g('#b_spec') };
      if ($('#b_time', sheet)) b.ready_time = g('#b_time');
      if ($('#b_venue', sheet)) b.venue = g('#b_venue');
      if ($('#b_total', sheet)) b.total_fee = g('#b_total').replace(/\D/g, '');
      if ($('#b_dm', sheet)) { b.deposit_mode = dmv; if (dmv === 'amount') b.deposit_amount = (g('#b_dep') || '').replace(/\D/g, ''); }
      Object.keys(b).forEach(function (k) { if (b[k] === '' || b[k] === undefined) delete b[k]; });
      var leadPatch = {};
      if ($('#b_service', sheet)) leadPatch.service = g('#b_service');
      if ($('#b_event', sheet)) leadPatch.event_date = g('#b_event');
      this.disabled = true; var self = this;
      var pre = Object.keys(leadPatch).length ? api('/leads/' + encodeURIComponent(lead.id), { method: 'PATCH', body: leadPatch }) : Promise.resolve();
      pre.then(function () { return api('/leads/' + encodeURIComponent(lead.id) + '/confirmations', { method: 'POST', body: { booking: b } }); })
        .then(function (r) { sheet.remove(); toast('Đã tạo ' + r.confirmation.id); bcPreview(lead, r.confirmation.snapshot, false); })
        .catch(function (e) { self.disabled = false; toast(e.message, true); });
    };
  }

  // ---------- vẽ canvas 1080×1350 (không thư viện; font tự host trong /assets/fonts) ----------
  function bcFontsReady() {
    var probe = 'Nguyễn Thị Hương Đặng Ưu Ơ ăâêôơư';
    return Promise.all([
      document.fonts.load('600 60px "Playfair Display"', probe), document.fonts.load('300 60px "Playfair Display"', probe), document.fonts.load('italic 400 30px "Playfair Display"', probe),
      document.fonts.load('300 30px "Be Vietnam Pro"', probe), document.fonts.load('400 30px "Be Vietnam Pro"', probe), document.fonts.load('500 30px "Be Vietnam Pro"', probe)
    ]).catch(function () { });
  }
  function wrapLines(ctx, text, maxW) {
    var out = []; String(text == null ? '' : text).split(/\r?\n/).forEach(function (para) {
      var words = para.split(/\s+/).filter(Boolean), line = '';
      if (!words.length) { out.push(''); return; }
      words.forEach(function (w) {
        var t = line ? line + ' ' + w : w;
        if (ctx.measureText(t).width <= maxW) line = t;
        else { if (line) out.push(line); line = w; while (ctx.measureText(line).width > maxW && line.length > 1) { var i = line.length - 1; while (i > 1 && ctx.measureText(line.slice(0, i)).width > maxW) i--; out.push(line.slice(0, i)); line = line.slice(i); } }
      });
      out.push(line);
    }); return out;
  }
  function spaced(ctx, text, x, y, spacing, align) {
    var chars = text.split(''), w = 0; chars.forEach(function (c) { w += ctx.measureText(c).width + spacing; }); w -= spacing;
    var cx = align === 'center' ? x - w / 2 : x; var ta = ctx.textAlign; ctx.textAlign = 'left';
    chars.forEach(function (c) { ctx.fillText(c, cx, y); cx += ctx.measureText(c).width + spacing; }); ctx.textAlign = ta;
  }
  function vnd(v) { return v == null ? '—' : Number(v).toLocaleString('vi-VN') + ' đ'; }
  function longDate(iso) { if (!iso) return ''; var d = new Date(iso + 'T00:00:00'); var days = ['Chủ nhật', 'Thứ Hai', 'Thứ Ba', 'Thứ Tư', 'Thứ Năm', 'Thứ Sáu', 'Thứ Bảy']; return days[d.getDay()] + ', ' + dmy(iso); }

  // k = hệ số co chữ phần thân (1 → 0.9 → 0.8 → 0.72) khi nội dung dài; trả {canvas, overflow}. Header/footer không co.
  function bcRenderK(snap, k) {
    var c = document.createElement('canvas'); c.width = BC.W; c.height = BC.H; var ctx = c.getContext('2d');
    var W = BC.W, H = BC.H, PAD = 84, CW = W - PAD * 2, y, overflow = false;
    var fs = function (n) { return Math.round(n * k); };
    var FOOT_TOP = H - 178;                       // đường kẻ footer
    ctx.fillStyle = BC.cream; ctx.fillRect(0, 0, W, H);
    // Header tối + wordmark (vẽ chữ, cùng kiểu logo SVG trong repo)
    ctx.fillStyle = BC.dark; ctx.fillRect(0, 0, W, 232);
    ctx.fillStyle = BC.cream; ctx.font = '300 60px "Playfair Display", Georgia, serif'; ctx.textBaseline = 'alphabetic';
    spaced(ctx, 'KINKAY', W / 2, 108, 26, 'center');
    ctx.strokeStyle = BC.gold; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(W / 2 - 150, 134); ctx.lineTo(W / 2 + 150, 134); ctx.stroke();
    ctx.fillStyle = BC.gold; ctx.font = '400 16px "Be Vietnam Pro", sans-serif'; spaced(ctx, 'MAKEUP ARTIST', W / 2, 164, 7, 'center');
    ctx.fillStyle = BC.cream; ctx.font = '500 20px "Be Vietnam Pro", sans-serif'; spaced(ctx, 'BOOKING CONFIRMATION', W / 2, 208, 5, 'center');
    // Mã + ngày phát hành
    y = 288; ctx.textAlign = 'left'; ctx.fillStyle = BC.mute; ctx.font = '400 22px "Be Vietnam Pro", sans-serif';
    ctx.fillText('Mã booking  ' + snap.booking_id + '   ·   V' + snap.version, PAD, y);
    ctx.textAlign = 'right'; ctx.fillText('Phát hành ' + dmy(snap.issued_at), W - PAD, y); ctx.textAlign = 'left';
    // Tên khách + dịch vụ
    y = 360; ctx.fillStyle = BC.ink; ctx.font = '600 ' + fs(54) + 'px "Playfair Display", Georgia, serif';
    var nameLines = wrapLines(ctx, snap.customer_name, CW).slice(0, 2); nameLines.forEach(function (ln) { ctx.fillText(ln, PAD, y); y += fs(62); });
    ctx.fillStyle = BC.gold2; ctx.font = 'italic 400 ' + fs(29) + 'px "Playfair Display", Georgia, serif';
    wrapLines(ctx, snap.service, CW).slice(0, 2).forEach(function (ln) { ctx.fillText(ln, PAD, y); y += fs(36); });
    y += fs(14); ctx.strokeStyle = BC.line; ctx.beginPath(); ctx.moveTo(PAD, y); ctx.lineTo(W - PAD, y); ctx.stroke(); y += fs(42);

    // Khối tiền: đo trước để biết cần bao nhiêu chỗ (gồm cả điều khoản thanh toán + ghi chú cho khách bên trong khối)
    var payLines = [], noteLines = [];
    if (snap.payment_terms) { ctx.font = '400 ' + fs(24) + 'px "Be Vietnam Pro", sans-serif'; payLines = wrapLines(ctx, snap.payment_terms, CW - 64).slice(0, 3); }
    var noteTxt = [snap.customer_note, snap.special_instructions].filter(Boolean).join(' · ');
    if (noteTxt) { ctx.font = 'italic 400 ' + fs(24) + 'px "Playfair Display", Georgia, serif'; noteLines = wrapLines(ctx, noteTxt, CW - 64).slice(0, 3); }
    var feeH = fs(30 + 54 + 46 + 46 + 26) + (payLines.length ? fs(10) + payLines.length * fs(31) : 0) + (noteLines.length ? fs(10) + noteLines.length * fs(31) : 0);
    var feeYMax = FOOT_TOP - 26 - feeH;          // khối tiền không được đè footer
    var limitY = feeYMax - 16;                    // các dòng thông tin phải dừng trước đây

    function label(txt, x, yy) { ctx.fillStyle = BC.mute; ctx.font = '500 ' + fs(18) + 'px "Be Vietnam Pro", sans-serif'; spaced(ctx, txt.toUpperCase(), x, yy, 3, 'left'); }
    function row(lbl, value, big) {
      if (value == null || value === '') return;
      var lh = fs(big ? 42 : 37), fits = Math.floor((limitY - (y + fs(32))) / lh);
      if (fits < 1) { overflow = true; return; }
      label(lbl, PAD, y); y += fs(32);
      ctx.fillStyle = BC.ink; ctx.font = (big ? '500 ' + fs(33) + 'px' : '400 ' + fs(29) + 'px') + ' "Be Vietnam Pro", sans-serif';
      var lines = wrapLines(ctx, value, CW);
      if (lines.length > fits) { overflow = true; lines = lines.slice(0, fits); lines[fits - 1] = lines[fits - 1].replace(/\s+\S*$/, '') + '…'; }
      lines.forEach(function (ln) { ctx.fillText(ln, PAD, y); y += lh; }); y += fs(20);
    }
    function row2(l1, v1, l2, v2) {
      var half = (CW - 40) / 2, yA, yB;
      label(l1, PAD, y); label(l2, PAD + half + 40, y); y += fs(32);
      ctx.fillStyle = BC.ink; ctx.font = '500 ' + fs(33) + 'px "Be Vietnam Pro", sans-serif';
      yA = y; wrapLines(ctx, v1, half).slice(0, 2).forEach(function (ln) { ctx.fillText(ln, PAD, yA); yA += fs(42); });
      yB = y; wrapLines(ctx, v2, half).slice(0, 2).forEach(function (ln) { ctx.fillText(ln, PAD + half + 40, yB); yB += fs(42); });
      y = Math.max(yA, yB) + fs(20);
    }
    row2('Ngày', longDate(snap.event_date), 'Giờ hẹn', snap.ready_time);
    row('Địa điểm', snap.venue);
    if (snap.pax) row('Số người', String(snap.pax));
    if (snap.includes) row('Gồm', snap.includes);
    if (snap.excludes) row('Không gồm', snap.excludes);

    // Khối tiền
    var feeY = Math.min(Math.max(y, 0), feeYMax);
    ctx.fillStyle = '#F3E8D8'; ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(PAD, feeY, CW, feeH, 20); else ctx.rect(PAD, feeY, CW, feeH); ctx.fill();
    if (y > feeYMax) overflow = true;
    var fy = feeY + fs(30 + 36), col = PAD + 32, colR = W - PAD - 32;
    function moneyRow(lbl, val, strong) {
      ctx.textAlign = 'left'; ctx.fillStyle = strong ? BC.ink : BC.mute; ctx.font = (strong ? '500 ' + fs(28) + 'px' : '400 ' + fs(25) + 'px') + ' "Be Vietnam Pro", sans-serif'; ctx.fillText(lbl, col, fy);
      ctx.textAlign = 'right'; ctx.fillStyle = BC.ink; ctx.font = (strong ? '600 ' + fs(34) + 'px' : '500 ' + fs(27) + 'px') + ' "Be Vietnam Pro", sans-serif'; ctx.fillText(val, colR, fy); ctx.textAlign = 'left';
    }
    moneyRow('Tổng phí', vnd(snap.total_fee), true); fy += fs(50);
    moneyRow('Cọc', snap.deposit_mode === 'amount' ? vnd(snap.deposit_amount) : (snap.deposit_mode === 'none' ? 'Không cần cọc' : 'Không áp dụng'), false); fy += fs(46);
    moneyRow('Còn lại', vnd(snap.remaining_balance), false); fy += fs(10);
    if (payLines.length) { fy += fs(24); ctx.fillStyle = BC.ink; ctx.font = '400 ' + fs(24) + 'px "Be Vietnam Pro", sans-serif'; payLines.forEach(function (ln) { ctx.fillText(ln, col, fy); fy += fs(31); }); }
    if (noteLines.length) { fy += fs(24); ctx.fillStyle = BC.gold2; ctx.font = 'italic 400 ' + fs(24) + 'px "Playfair Display", Georgia, serif'; noteLines.forEach(function (ln) { ctx.fillText(ln, col, fy); fy += fs(31); }); }

    // Footer
    ctx.strokeStyle = BC.line; ctx.beginPath(); ctx.moveTo(PAD, FOOT_TOP); ctx.lineTo(W - PAD, FOOT_TOP); ctx.stroke();
    ctx.fillStyle = BC.mute; ctx.font = '300 21px "Be Vietnam Pro", sans-serif'; ctx.textAlign = 'center';
    wrapLines(ctx, snap.brand.footer, CW).slice(0, 2).forEach(function (ln, i) { ctx.fillText(ln, W / 2, FOOT_TOP + 44 + i * 30); });
    ctx.fillStyle = BC.ink; ctx.font = '500 24px "Be Vietnam Pro", sans-serif'; ctx.fillText(snap.brand.site + '   ·   ' + snap.brand.phone + '   ·   Instagram ' + snap.brand.instagram, W / 2, H - 56);
    ctx.textAlign = 'left';
    return { canvas: c, overflow: overflow };
  }
  function bcRender(snap) {
    var r; [1, 0.9, 0.8, 0.72].some(function (k) { r = bcRenderK(snap, k); return !r.overflow; });
    return r.canvas;
  }

  function bcPreview(lead, snap, isHistory) {
    var wrap = document.createElement('div'); wrap.className = 'sheet-bg';
    wrap.innerHTML = '<div class="sheet"><div class="grab"></div><h3>' + esc(snap.confirmation_id) + '</h3><div class="muted">' + (isHistory ? 'Bản đã phát hành ' + esc(dmy(snap.issued_at)) + ' (lịch sử, không đổi)' : 'Bản mới. Kiểm tra rồi chia sẻ.') + '</div>' +
      '<div class="bcprev" id="bcCanvasWrap" style="margin-top:10px"><div class="empty">Đang vẽ…</div></div>' +
      '<div class="bcbtns"><button class="btn bc" id="bcShare">Chia sẻ ảnh</button><button class="btn sec" id="bcSave">Lưu ảnh</button>' +
      (isHistory ? '' : '<button class="btn sec" id="bcEdit">Sửa chi tiết & tạo lại</button>') + '<button class="btn sec" id="bcClose">Đóng</button></div></div>';
    document.body.appendChild(wrap);
    var blob = null;
    bcFontsReady().then(function () {
      var canvas = bcRender(snap); $('#bcCanvasWrap', wrap).innerHTML = ''; $('#bcCanvasWrap', wrap).appendChild(canvas);
      canvas.toBlob(function (b) { blob = b; }, 'image/png');
    });
    var fname = snap.confirmation_id + '.png';
    $('#bcShare', wrap).onclick = function () {
      if (!blob) { toast('Ảnh chưa sẵn sàng, thử lại'); return; }
      var file = new File([blob], fname, { type: 'image/png' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        navigator.share({ files: [file], title: 'KINKAY · Booking Confirmation' }).then(function () { toast('Đã mở chia sẻ'); }).catch(function (e) { if (e && e.name !== 'AbortError') toast('Không chia sẻ được: ' + e.message, true); });
      } else { toast('Trình duyệt không hỗ trợ chia sẻ file, đang lưu ảnh'); bcSaveBlob(blob, fname); }
    };
    $('#bcSave', wrap).onclick = function () { if (!blob) { toast('Ảnh chưa sẵn sàng'); return; } bcSaveBlob(blob, fname); };
    if (!isHistory) $('#bcEdit', wrap).onclick = function () { wrap.remove(); api('/leads/' + encodeURIComponent(lead.id) + '/confirmations').then(function (d) { bcForm(lead, d.booking, d.missing, true); }); };
    $('#bcClose', wrap).onclick = function () { wrap.remove(); if (!isHistory) viewLead(lead.id); };
  }
  function bcSaveBlob(blob, fname) {
    var url = URL.createObjectURL(blob);
    if (/iPhone|iPad|iPod/.test(navigator.userAgent)) { window.open(url, '_blank'); toast('Nhấn giữ ảnh → Lưu vào Ảnh'); }
    else { var a = document.createElement('a'); a.href = url; a.download = fname; document.body.appendChild(a); a.click(); a.remove(); toast('Đã tải ' + fname); }
    setTimeout(function () { URL.revokeObjectURL(url); }, 60000);
  }

  // ---------- router ----------
  function render() {
    if (!state.lists) { renderLogin(); return; }
    var h = location.hash || '#/today';
    var m;
    if (h === '#/today') viewToday();
    else if (h === '#/leads') viewLeads();
    else if ((m = h.match(/^#\/lead\/(.+)$/))) viewLead(decodeURIComponent(m[1]));
    else if (h === '#/new') viewNew();
    else if (h === '#/partners') viewPartners();
    else if (h === '#/partner-new') viewPartnerNew();
    else if ((m = h.match(/^#\/partner\/(.+)$/))) viewPartner(decodeURIComponent(m[1]));
    else if (h === '#/more') viewMore();
    else { location.hash = '#/today'; }
  }
  window.addEventListener('hashchange', render);
  boot();
})();
</script>
