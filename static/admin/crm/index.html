      '<div class="bcbtns" style="margin-top:8px"' + (SENDABLE ? '' : ' hidden id="bcSendRow"') + '><button class="btn bc" id="bcShare" disabled>Đang tạo ảnh…</button><button class="btn sec" id="bcSave" disabled>Lưu ảnh</button>' +
      (isHistory ? '' : '<button class="btn sec" id="bcEdit">Sửa thông tin</button>') + '<button class="btn sec" id="bcClose">Đóng</button></div>' +
      '<div class="bcprev" id="bcCanvasWrap" style="margin-top:10px"><div class="empty" id="bcSpin">⏳ Đang tạo ảnh 1080×1350…</div></div></div>';
    document.body.appendChild(wrap);
    var sheetEl = $('.sheet', wrap), blob = null, canvas = null, fname = snap.confirmation_id + '.png';

    var imgReady = false;
    function ready() {
      imgReady = true;
      if (!SENDABLE && !unlocked) return;   // 'voided' khong bao gio toi day
      $('#bcShare', wrap).disabled = false; $('#bcShare', wrap).textContent = 'Chia sẻ ảnh'; $('#bcSave', wrap).disabled = false;
    }
    // Mo khoa ban 'superseded': phai bam hai lan, khong bam nham mot phat la gui.
    var ub = null;
    setTimeout(function () {
      ub = $('#bcUnlock', wrap);
      if (!ub) return;
      var armed = false;
      ub.onclick = function () {
        if (!armed) { armed = true; ub.textContent = 'Bấm lần nữa để xác nhận gửi bản CŨ'; ub.style.color = '#B3261E'; return; }
        unlocked = true; ub.remove();
        var row = $('#bcSendRow', wrap); if (row) row.hidden = false;
        if (imgReady) ready();
      };
    }, 0);
    function fail(e) {
      bcShowErr(sheetEl, 'Không tạo được ảnh. Vui lòng thử lại.', e);
      $('#bcCanvasWrap', wrap).innerHTML = '<button class="btn sec" id="bcRetry" style="margin:0">Thử lại</button>';
      $('#bcShare', wrap).textContent = 'Chia sẻ ảnh';
      var rb = $('#bcRetry', wrap); if (rb) rb.onclick = function () { $('#bcCanvasWrap', wrap).innerHTML = '<div class="empty">⏳ Đang tạo ảnh…</div>'; var eb = $('#bcErr', wrap); if (eb) eb.hidden = true; run(); };
    }
    function run() {
      bcFontsReadyTimeout().then(function () {
        canvas = bcRender(snap);
        if (!canvas || canvas.width !== BC.W) throw new Error('canvas không hợp lệ');
        $('#bcCanvasWrap', wrap).innerHTML = ''; $('#bcCanvasWrap', wrap).appendChild(canvas);
        return bcToBlob(canvas);
      }).then(function (b) {
        if (!b || !b.size) throw new Error('blob rỗng');
        blob = b; ready(); console.log('[KINKAY BC] PNG', canvas.width + 'x' + canvas.height, Math.round(b.size / 1024) + ' KB');
      }).catch(fail);
    }
    run();

    $('#bcShare', wrap).onclick = function () {
      if (!blob) { bcShowErr(sheetEl, 'Ảnh chưa sẵn sàng, đợi vài giây rồi thử lại.'); return; }
      var file; try { file = new File([blob], fname, { type: 'image/png' }); } catch (e) { file = null; }
      if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
        navigator.share({ files: [file], title: 'KINKAY · Booking Confirmation' })
          .then(function () { toast('Đã mở chia sẻ'); })
          .catch(function (e) { if (e && e.name === 'AbortError') return; bcShowErr(sheetEl, 'Không chia sẻ được (' + (e && e.message) + '). Đang lưu ảnh để gửi tay.', e); bcSaveBlob(blob, fname, sheetEl); });
      } else { bcShowErr(sheetEl, 'Trình duyệt này không chia sẻ được file trực tiếp. Đang lưu ảnh, mở Zalo/IG rồi chọn ảnh từ máy.'); bcSaveBlob(blob, fname, sheetEl); }
    };
    $('#bcSave', wrap).onclick = function () { if (!blob) { bcShowErr(sheetEl, 'Ảnh chưa sẵn sàng, đợi vài giây rồi thử lại.'); return; } bcSaveBlob(blob, fname, sheetEl); };
    if (!isHistory) $('#bcEdit', wrap).onclick = function () { wrap.remove(); api('/leads/' + encodeURIComponent(lead.id) + '/confirmations').then(function (d) { bcForm(lead, d.booking, d.missing, true, d.language); }).catch(function (e) { toast(e.message, true); }); };
    $('#bcClose', wrap).onclick = function () { wrap.remove(); if (!isHistory) viewLead(lead.id); };
  }
  function bcSaveBlob(blob, fname, root) {
    try {
      var url = URL.createObjectURL(blob);
      if (/iPhone|iPad|iPod/.test(navigator.userAgent)) {
        // iOS Safari không tải file qua a[download] ổn định: mở ảnh tab mới → nhấn giữ → Lưu vào Ảnh.
        var w = window.open(url, '_blank');
        if (!w) { var a0 = document.createElement('a'); a0.href = url; a0.target = '_blank'; a0.rel = 'noopener'; a0.textContent = 'Mở ảnh'; document.body.appendChild(a0); a0.click(); a0.remove(); }
        if (root) bcShowErr(root, 'Ảnh đã mở ở tab mới: nhấn giữ ảnh → "Lưu vào Ảnh" (Save to Photos).'); else toast('Nhấn giữ ảnh → Lưu vào Ảnh');
      } else {
        var a = document.createElement('a'); a.href = url; a.download = fname; document.body.appendChild(a); a.click(); a.remove();
        toast('Đã lưu ' + fname);
      }
      setTimeout(function () { URL.revokeObjectURL(url); }, 60000);
    } catch (e) { if (root) bcShowErr(root, 'Không lưu được ảnh. Vui lòng thử lại.', e); else toast('Không lưu được ảnh', true); }
  }

  // ---------- router ----------
  function render() {
    if (!state.lists) { renderLogin(); return; }
    var h = location.hash || '#/today';
    var m;
    if (h === '#/today') viewToday();
    else if (h === '#/leads') viewLeads();
    else if ((m = h.match(/^#\/lead\/(.+)$/))) viewLead(decodeURIComponent(m[1]));
    else if ((m = h.match(/^#\/khach\/(.+)$/))) viewCustomer(decodeURIComponent(m[1]));
    else if (h === '#/new') viewNew();
    else if (h === '#/partners') viewPartners();
    else if (h === '#/partner-new') viewPartnerNew();
    else if ((m = h.match(/^#\/partner\/(.+)$/))) viewPartner(decodeURIComponent(m[1]));
    else if (h === '#/more') viewMore();
    else { location.hash = '#/today'; }
  }
  window.addEventListener('hashchange', render);
  boot();
})();
</script>
</body>
</html>
