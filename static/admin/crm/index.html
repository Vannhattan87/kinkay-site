<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#faf7f2">
<title>KINKAY CRM</title>
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/assets/fonts/fonts.css">
<!--
  KINKAY CRM · v1.0 MVP · 06/09/2026 · CR-20260906-28 · v1.3 11/09/2026: nút Xoá (có lý do, khôi phục được) + dò khách trùng
  Một file, không framework, mobile-first. Dữ liệu ở Cloudflare D1 qua /api/crm/*.
  Đăng nhập: dùng lại popup OAuth GitHub của Sveltia CMS (kinkay-site.pages.dev/auth). Ai đăng bài được thì dùng CRM được.
  /admin/* đã có X-Frame-Options DENY + no-store + noindex trong static/_headers, không có CSP (cố ý, xem _headers).
-->
<style>
  :root{--bg:#faf7f2;--card:#fff;--ink:#2a2622;--mute:#7b736a;--line:#e9e2d8;--gold:#b8975a;--gold2:#8f7340;--red:#c0392b;--green:#2e7d4f;--blue:#2c5f8a;--amber:#b7791f;--r:14px}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Be Vietnam Pro","Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
  a{color:var(--gold2)}
  #app{max-width:720px;margin:0 auto;padding:12px 12px calc(84px + env(safe-area-inset-bottom))}
  header.top{display:flex;align-items:center;justify-content:space-between;padding:6px 2px 10px}
  header.top h1{font:600 18px/1 "Playfair Display",Georgia,serif;letter-spacing:.06em;margin:0}
  header.top small{color:var(--mute);font-size:12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin:0 0 10px}
  .card h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:0 0 8px;display:flex;justify-content:space-between;align-items:center}
  .card h2 b{color:var(--ink);font-weight:600}
  .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px}
  .kpi .v{font-size:18px;font-weight:600;line-height:1.1}
  .kpi .l{font-size:11px;color:var(--mute);margin-top:4px}
  .row{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
  .row:first-of-type{border-top:0}
  .row .main{flex:1;min-width:0}
  .row .t{font-weight:600}
  .row .s{font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .right{text-align:right;font-size:12px;color:var(--mute);white-space:nowrap}
  .pill{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);background:#f4efe7;color:var(--ink);white-space:nowrap}
  .pill.New{background:#eef4fb;color:var(--blue);border-color:#d6e4f2}
  .pill.Quoted,.pill.Qualified,.pill.Contacted,.pill.Waiting\ for\ Response,.pill.Hold{background:#fbf3e4;color:var(--amber);border-color:#f0dfbf}
  .pill.Deposit\ Paid,.pill.Confirmed{background:#e9f5ee;color:var(--green);border-color:#cfe8d9}
  .pill.Completed{background:#eee;color:#555}
  .pill.Lost{background:#fbeaea;color:var(--red);border-color:#f2cfcf}
  .pill.due{background:#fbf3e4;color:var(--amber)}
  .pill.over{background:#fbeaea;color:var(--red)}
  .empty{color:var(--mute);font-size:14px;padding:6px 0}
  .chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;-webkit-overflow-scrolling:touch}
  .chips button{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px;color:var(--ink)}
  .chips button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  label{display:block;font-size:12px;color:var(--mute);margin:10px 0 4px}
  input,select,textarea{width:100%;font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
  textarea{min-height:72px;resize:vertical}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font:inherit;font-size:15px;font-weight:600;padding:12px 16px;border-radius:12px;border:1px solid var(--gold);background:var(--gold);color:#fff;width:100%;margin-top:12px;cursor:pointer}
  .btn.sec{background:#fff;color:var(--ink);border-color:var(--line);font-weight:500}
  .btn.sm{width:auto;padding:8px 12px;font-size:13px;margin:0}
  .btn:disabled{opacity:.5}
  .quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
  .quick button{font:inherit;font-size:13px;padding:6px 10px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--ink)}
  .quick button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 0 calc(6px + env(safe-area-inset-bottom));z-index:5}
  .bar a{flex:1;text-align:center;text-decoration:none;color:var(--mute);font-size:11px;padding:4px 0}
  .bar a span{display:block;font-size:20px;line-height:1.1}
  .bar a.on{color:var(--gold2);font-weight:600}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom));background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;z-index:40;pointer-events:none;max-width:90%}
  .toast.on{opacity:1}
  .toast.err{background:var(--red)}
  .hist{font-size:12px;color:var(--mute)}
  .hist div{padding:4px 0;border-top:1px dashed var(--line)}
  .money{font-variant-numeric:tabular-nums}
  .back{background:none;border:0;font:inherit;color:var(--gold2);padding:0;margin:0 0 8px;cursor:pointer}
  .warn{background:#fbf3e4;border:1px solid #f0dfbf;color:#6b4a0b;border-radius:10px;padding:8px 10px;font-size:13px;margin:8px 0}
  .login{max-width:360px;margin:15vh auto;text-align:center}
  .login h1{font:600 26px "Playfair Display",Georgia,serif;letter-spacing:.1em}
  .muted{color:var(--mute);font-size:13px}
  details summary{cursor:pointer;color:var(--gold2);font-size:14px;margin:10px 0 4px}
  /* Booking Confirmation (CR-29) */
  .btn.bc{background:#1A0F08;border-color:#1A0F08;color:#FAF0E4;letter-spacing:.02em}
  .btn.bc.soft{background:#fff;color:#1A0F08;border-color:#C4A882}
  .sheet-bg{position:fixed;inset:0;background:rgba(26,15,8,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
  .sheet{background:var(--bg);width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:14px 16px calc(16px + env(safe-area-inset-bottom));box-shadow:0 -8px 30px rgba(0,0,0,.2)}
  .sheet h3{margin:4px 0 2px;font:600 17px "Playfair Display",Georgia,serif}
  .sheet .grab{width:38px;height:4px;border-radius:2px;background:#d9cfc2;margin:0 auto 8px}
  .miss{color:var(--red);font-size:12px}
  /* CR-20260916-34 · chi tiết buổi làm + ảnh chụp tại chỗ */
  .jobd .jh{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .jobd .jh h2{margin:0}
  .jobd .when{font-size:17px;font-weight:600;margin:8px 0}
  .facts{width:100%;border-collapse:collapse;font-size:14px}
  .facts td{padding:5px 0;vertical-align:top;border-top:1px dashed var(--line)}
  .facts td:first-child{color:var(--mute);width:92px;white-space:nowrap;padding-right:10px}
  .pricebox{margin-top:12px}
  table.li{width:100%;border-collapse:collapse;font-size:14px}
  table.li td{padding:5px 0;border-top:1px dashed var(--line);vertical-align:top}
  table.li td.r{text-align:right;white-space:nowrap;padding-left:10px}
  table.li .s{font-size:12px;color:var(--mute)}
  .tot{display:flex;justify-content:space-between;align-items:baseline;gap:8px;border-top:1px solid var(--line);margin-top:6px;padding-top:8px;font-size:14px}
  .tot b{font-size:18px}
  .camrow{display:flex;gap:8px;margin:12px 0 4px}
  .camrow .btn{flex:1;margin:0}
  .thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:4px 0 8px}
  .thumbs figure{margin:0;position:relative}
  .thumbs img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:8px;background:#efe9e2;display:block}
  .thumbs .x{position:absolute;top:4px;right:4px;border:0;border-radius:50%;width:24px;height:24px;line-height:24px;padding:0;background:rgba(0,0,0,.55);color:#fff;font-size:15px;cursor:pointer}
  .thumbs figcaption{font-size:11px;color:var(--mute);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* CR-20260916-35 · hồ sơ buổi làm + link gửi khách */
  /* CR-20260916-37 · băng báo database chưa khớp code */
  #hbanner .hb{background:#fdecea;border:1px solid #f2c4bd;color:#7a2318;border-radius:10px;
    padding:10px 12px;margin:0 0 10px;font-size:13px;line-height:1.55}
  #hbanner .hb div+div{margin-top:6px;padding-top:6px;border-top:1px dashed #f2c4bd}
  .lkrow{border-top:1px dashed var(--line);padding:8px 0}
  .lklab{font-size:12px;color:var(--mute);margin-bottom:2px}
  .lkval{white-space:pre-wrap;font-size:14px}
  .lkval.empty{color:var(--mute);font-style:italic}
  .pill.int{background:#efe7dc;color:#6b5c47;border-color:#e0d4c2}
  .shbox{margin-top:12px;border-top:1px solid var(--line);padding-top:12px}
  .shbox .shlab{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin-bottom:8px}
  .shbox.on .shlab{color:var(--gold2)}
  .shurl{font-size:12px;word-break:break-all;background:#f6f1e9;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:8px}
  .shbtns{display:flex;gap:6px;flex-wrap:wrap}
  .shbtns .btn{margin:0}
  .thumbs.pick figure{cursor:pointer}
  .thumbs.pick img{opacity:.42;transition:opacity .12s}
  .thumbs.pick figure.on img{opacity:1;outline:3px solid var(--gold2);outline-offset:-3px}
  .thumbs.pick .tick{position:absolute;top:4px;left:4px;width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.9);color:#3d342b;font-size:13px;line-height:22px;text-align:center}
  .thumbs.pick figure.on .tick{background:var(--gold2);color:#fff}
  /* CR-36 bộ chọn look: chip đủ to để bấm bằng ngón cái trong lúc còn đang dọn đồ nghề. */
  .pkbox{border:1px solid var(--line);border-radius:10px;padding:2px 12px 12px;margin:4px 0 12px;background:#fdfbf8}
  .pkgrp{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--mute);margin:12px 0 5px}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 13px;font-size:13px;color:var(--ink);cursor:pointer;line-height:1.25}
  .chip.on{background:var(--gold2);border-color:var(--gold2);color:#fff}
  .pkout{font-size:13px;line-height:1.5;background:#fff;border:1px dashed var(--line);border-radius:8px;padding:8px 10px;margin-top:10px}
  .pkout b{display:block;font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--mute);font-weight:600;margin-bottom:2px}
  .pkout .em{color:var(--mute);font-style:italic}
  .lcstrip{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px}
  .lcstrip img{width:56px;height:70px;object-fit:cover;border-radius:6px;background:#efe9e2;opacity:.45;cursor:pointer;flex:0 0 auto}
  .lcstrip img.on{opacity:1;outline:3px solid var(--gold2);outline-offset:-3px}
  .lcchk{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink);margin:6px 0 2px}
  .lcchk input{width:18px;height:18px;margin:0}
  .card.tl.me{border-color:var(--gold2)}
  details.histbox{padding:12px 14px}
  details.histbox summary{margin:0}
  .bcprev{background:#e9e2d8;border-radius:14px;padding:10px;display:flex;justify-content:center}
  .bcprev canvas{width:100%;max-width:360px;height:auto;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.18);display:block}
  .bcbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
  .bcbtns .btn{margin:0}
  .seg{display:flex;gap:6px}
  .seg button{flex:1;font:inherit;font-size:13px;padding:9px 6px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink)}
  .seg button.on{background:#1A0F08;color:#FAF0E4;border-color:#1A0F08}
  /* Xoá + chống trùng (11/09/2026) */
  .btn.danger{background:#fff;color:var(--red);border-color:#f2cfcf;font-weight:600}
  .btn.danger.solid{background:var(--red);color:#fff;border-color:var(--red)}
  .pill.dup{background:#fbeaea;color:var(--red);border-color:#f2cfcf}
  .pill.rep{background:#f4efe7;color:var(--mute)}
  .dupbox{border:1px solid #f0dfbf;background:#fffaf1;border-radius:12px;padding:8px 10px;margin-top:10px}
  .dupbox.hard{border-color:#f2cfcf;background:#fdf3f3}
  .dupbox h4{margin:0 0 4px;font-size:13px}
  .dupbox .row{padding:8px 0}
  .dupbox .acts{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
  .undo{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .undo button{font:inherit;font-size:13px;font-weight:600;color:var(--gold2);background:none;border:0;padding:4px 0;cursor:pointer;white-space:nowrap}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

<script>
(function () {
  'use strict';
  var API = '/api/crm';
  var AUTH_BASE = 'https://kinkay-site.pages.dev';   // trùng base_url trong static/admin/config.yml
  var TOKEN_KEY = 'kk_crm_token';
  var app = document.getElementById('app');
  var state = { token: null, lists: null, user: null, dev: false, cutover: false, ai: false, route: '#/today', filter: '', q: '', pfilter: '', lastDeleted: null };

  // ---------- helpers ----------
  function $(sel, root) { return (root || document).querySelector(sel); }
  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function money(v) { if (v == null || v === '') return '—'; return Number(v).toLocaleString('vi-VN') + ' ₫'; }
  function dmy(iso) { if (!iso) return ''; var p = String(iso).slice(0, 10).split('-'); return p.length === 3 ? p[2] + '/' + p[1] + '/' + p[0] : iso; }
  function todayVN() { return new Date(Date.now() + 7 * 3600e3).toISOString().slice(0, 10); }
  function addDays(iso, n) { var d = new Date(Date.parse(iso || todayVN()) + n * 86400e3); return d.toISOString().slice(0, 10); }
  var toastT;
  function toast(msg, isErr) { var t = $('#toast'); t.textContent = msg; t.className = 'toast on' + (isErr ? ' err' : ''); clearTimeout(toastT); toastT = setTimeout(function () { t.className = 'toast'; }, isErr ? 4000 : 2000); }
  function opts(list, cur, allowEmpty) { var h = allowEmpty ? '<option value="">—</option>' : ''; (list || []).forEach(function (o) { h += '<option' + (o === cur ? ' selected' : '') + '>' + esc(o) + '</option>'; }); return h; }
  function pill(s, extra) { return '<span class="pill ' + esc(s) + (extra ? ' ' + extra : '') + '">' + esc(s) + '</span>'; }
  function dueClass(iso, today) { if (!iso) return ''; return iso < today ? 'over' : (iso === today ? 'due' : ''); }

  // Chuẩn hoá tên/contact để nhận ra cùng khách. PHẢI khớp normName/normContact trong functions/api/crm/_lib.js.
  var NAME_PREFIX = /^(?:(?:ms|mrs|mr|miss|mdm|madam|dr|chị|cô|bạn)(?:\.\s*|\s+)|(?:c|a|e)\.\s*)/;
  function normName(v) {
    var s = String(v || '').normalize('NFC').toLowerCase().trim();
    for (var i = 0; i < 2; i++) { var t = s.replace(NAME_PREFIX, ''); if (t.trim()) s = t.trim(); }
    s = s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/g, 'd');
    return s.replace(/[^a-z0-9\s]/g, ' ').replace(/\s+/g, ' ').trim();
  }
  function normContact(v) {
    var s = String(v || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim().toLowerCase();
    if (!s || /^(not retained|n\/?a|na|none|null|unknown|khong|khong co|chua co|chua|-+|—|\?+|0+)$/.test(s)) return '';
    var ph = s.replace(/(\d)[\s.()-]+(?=\d)/g, '$1').match(/(?:\+?84|0)\d{8,10}/);
    if (ph && !/@[a-z]/.test(s)) { var d = ph[0].replace(/\D/g, ''); return d.indexOf('84') === 0 ? '0' + d.slice(2) : d; }
    s = s.replace(/^https?:\/\/(www\.)?(instagram\.com|facebook\.com|fb\.com|tiktok\.com\/@?)\/?/, '').replace(/^@/, '').replace(/\/+$/, '').trim();
    return s.length >= 3 ? s : '';
  }
  // Đánh dấu trong danh sách: "Trùng?" = cùng khách + cùng ngày + cùng dịch vụ; "N job" = khách có nhiều job.
  function dupMeta(leads) {
    var byCust = {}, byJob = {}, meta = {};
    leads.forEach(function (l) {
      var keys = []; var n = normName(l.customer_name), c = normContact(l.contact);
      if (c) keys.push('c:' + c); if (n) keys.push('n:' + n);
      l._keys = keys;
      keys.forEach(function (k) { (byCust[k] = byCust[k] || {})[l.id] = 1; if (l.event_date && l.service) { var jk = k + '|' + l.event_date + '|' + l.service; (byJob[jk] = byJob[jk] || {})[l.id] = 1; } });
    });
    leads.forEach(function (l) {
      var jobs = {}, dup = false;
      l._keys.forEach(function (k) {
        Object.keys(byCust[k]).forEach(function (id) { jobs[id] = 1; });
        if (l.event_date && l.service && Object.keys(byJob[k + '|' + l.event_date + '|' + l.service]).length > 1) dup = true;
      });
      meta[l.id] = { jobs: Object.keys(jobs).length, dup: dup };
    });
    return meta;
  }
  var DELETE_REASONS = ['Nhập trùng', 'Nhập sai', 'Test', 'Khác'];
  function histVal(v) { v = String(v); return v.charAt(0) === '{' && v.length > 80 ? '(bản gốc đã lưu)' : v; }
  function openSheet(inner) {
    var bg = document.createElement('div'); bg.className = 'sheet-bg';
    bg.innerHTML = '<div class="sheet"><div class="grab"></div>' + inner + '</div>';
    document.body.appendChild(bg);
    bg.addEventListener('click', function (e) { if (e.target === bg) bg.remove(); });
    return bg;
  }
  function sheetErr(root, msg) {
    var box = $('.sheet-err', root); if (!box) { box = document.createElement('div'); box.className = 'warn sheet-err'; box.style.cssText = 'background:#fbeaea;border-color:#f2cfcf;color:#8a1c1c'; $('.sheet', root).insertBefore(box, $('.sheet h3', root).nextSibling); }
    box.textContent = msg;
  }
  // Xoá có lý do. Không dùng confirm() của trình duyệt (iPhone/Zalo webview hay chặn).
  function confirmDelete(entity, rec) {
    var isLead = entity === 'lead';
    var reason = '';
    var bg = openSheet('<h3>Xoá ' + esc(rec.id) + '?</h3>' +
      '<div class="muted">' + esc(isLead ? [rec.customer_name, rec.service, rec.event_date ? dmy(rec.event_date) : '', rec.expected_revenue != null ? money(rec.expected_revenue) : ''].filter(Boolean).join(' · ') : [rec.name, rec.type].filter(Boolean).join(' · ')) + '</div>' +
      '<div class="warn" style="margin-top:10px">' + (isLead ? 'Khách thật không chốt → đổi trạng thái <b>Lost</b>, đừng xoá. Chỉ xoá khi nhập trùng, nhập sai hoặc test.' : 'Đối tác ngừng hợp tác → đổi trạng thái <b>Closed</b>. Chỉ xoá khi nhập sai hoặc trùng.') + ' Khôi phục được ở tab <b>Thêm → Đã xoá</b>.</div>' +
      '<label>Lý do *</label><div class="seg" id="d_reason">' + DELETE_REASONS.map(function (r) { return '<button type="button" data-v="' + esc(r) + '">' + esc(r) + '</button>'; }).join('') + '</div>' +
      '<div class="bcbtns"><button class="btn sec" id="d_cancel">Huỷ</button><button class="btn danger solid" id="d_ok" disabled>Xoá</button></div>');
    bg.querySelectorAll('#d_reason button').forEach(function (b) { b.onclick = function () { reason = b.getAttribute('data-v'); bg.querySelectorAll('#d_reason button').forEach(function (x) { x.className = x === b ? 'on' : ''; }); $('#d_ok', bg).disabled = false; }; });

  function api(path, opt) {
    opt = opt || {};
    var h = { 'Content-Type': 'application/json' };
    if (state.token) h.Authorization = 'Bearer ' + state.token;
    return fetch(API + path, { method: opt.method || 'GET', headers: h, body: opt.body ? JSON.stringify(opt.body) : undefined })
      .then(function (r) {
        if (r.status === 401) { logout(false); throw new Error('Phiên đăng nhập hết hạn, đăng nhập lại.'); }
        /* CR-20260916-34: trước đây gọi thẳng r.json(). Khi Pages Function ném lỗi, Cloudflare trả về
           TRANG HTML chứ không phải JSON, nên người dùng nhận đúng câu "Unexpected token '<'" — không
           nói được gì cho ai và giấu mất nguyên nhân thật (thiếu migration / thiếu binding).
           Đọc text trước, parse sau, hỏng thì nói rõ là máy chủ lỗi chứ không phải dữ liệu sai. */
        return r.text().then(function (t) {
          var j = null; try { j = t ? JSON.parse(t) : null; } catch (x) { j = null; }
          if (j === null) {
            var eh = new Error('Máy chủ lỗi ' + r.status + ' — trả về trang HTML, không phải dữ liệu. Thường là thiếu migration hoặc thiếu binding trên Cloudflare.');
            eh.status = r.status; eh.raw = String(t).slice(0, 300); throw eh;
          }
          if (!r.ok || j.ok === false) { var er = new Error((j && j.error) ? j.error + (j.detail ? ' · ' + (Array.isArray(j.detail) ? j.detail.join('; ') : j.detail) : '') : 'Lỗi ' + r.status); er.status = r.status; er.data = j; throw er; }
          return j;
        });
      });
  }

  // ---------- auth ----------
  function login() {
    var popup = window.open(AUTH_BASE + '/auth?provider=github&site_id=' + encodeURIComponent(location.hostname), 'kk_auth', 'width=600,height=700');
    if (!popup) { toast('Trình duyệt chặn popup. Cho phép popup rồi thử lại.', true); return; }
    function onMsg(e) {
      if (e.origin !== AUTH_BASE) return;
      if (e.data === 'authorizing:github') { e.source.postMessage('authorizing:github', e.origin); return; }
      if (typeof e.data === 'string' && e.data.indexOf('authorization:github:') === 0) {
        window.removeEventListener('message', onMsg);
        var m = e.data.match(/^authorization:github:(success|error):(.+)$/);
        try { var payload = JSON.parse(m[2]); } catch (x) { payload = {}; }
        if (m[1] === 'success' && payload.token) {
          state.token = payload.token; try { localStorage.setItem(TOKEN_KEY, payload.token); } catch (x) { }
          boot();
        } else toast('Đăng nhập không thành công: ' + (payload.error || ''), true);
        try { popup.close(); } catch (x) { }
      }
    }
    window.addEventListener('message', onMsg);
  }

  /* Nén ảnh ở máy trước khi gửi: ảnh gốc điện thoại 4–8MB, gửi nguyên qua 4G ở khách sạn là hỏng.
     1600px cạnh dài + JPEG 0.75 ra ~250–400KB — đủ nét để xem lại look và để chọn ảnh marketing. */
  function shrinkImage(file, maxPx, quality) {
    function draw(src, w, h) {
      var s = Math.min(1, maxPx / Math.max(w, h));
      var c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(w * s)); c.height = Math.max(1, Math.round(h * s));
      c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
      return new Promise(function (res, rej) {
        c.toBlob(function (b) { b ? res(b) : rej(new Error('Không nén được ảnh')); }, 'image/jpeg', quality);
      });
    }
    // imageOrientation: ảnh dọc chụp bằng điện thoại mang cờ EXIF; thiếu dòng này ảnh nằm ngang.
    if (window.createImageBitmap) {
      return createImageBitmap(file, { imageOrientation: 'from-image' })
        .then(function (bm) { return draw(bm, bm.width, bm.height); });
    }
    return new Promise(function (res, rej) {
      var img = new Image(), u = URL.createObjectURL(file);
      img.onload = function () { draw(img, img.naturalWidth, img.naturalHeight).then(res, rej); URL.revokeObjectURL(u); };
      img.onerror = function () { URL.revokeObjectURL(u); rej(new Error('Không đọc được file ảnh')); };
      img.src = u;

       href. Server đã chặn, nhưng dòng cũ trong DB (hoặc một đường ghi khác sau này) vẫn có

       chữ thường kèm cảnh báo. Nhãn luôn đi qua `esc()`, không bao giờ nối chuỗi thô. */
    function safeUrl(u) {

        '<div class="camrow"><button class="btn bc" id="m_cam">Chụp ảnh</button>' +
        '<button class="btn sec" id="m_pick">Chọn từ máy</button></div>' +
        '<input type="file" id="m_camf" accept="image/*" capture="environment" style="display:none">' +
        '<input type="file" id="m_pickf" accept="image/*" multiple style="display:none">' +
        '<p class="muted" id="m_st">Ảnh lưu trong kho riêng của KINKAY, phải đăng nhập mới xem được. Không public, không ai đoán link ra được.</p>' +
        '<details><summary>Hoặc dán link album Drive</summary>' +
        '<label>Link album Drive hoặc ảnh</label><input id="m_url" placeholder="https://drive.google.com/drive/folders/...">' +
        '<label>Ghi nhớ ngắn (tuỳ chọn)</label><input id="m_label" placeholder="Ví dụ: Lễ gia tiên sáng 14/11">' +
        '<label style="display:flex;gap:8px;align-items:center;margin-top:10px">' +
          '<input type="checkbox" id="m_mk" style="width:auto;margin:0"> Được phép dùng cho marketing</label>' +
        '<p class="muted" style="margin:4px 0 10px">Mặc định chỉ xem nội bộ. Chỉ tick khi khách đã đồng ý cho dùng ảnh. ' +
          'Đừng để folder Drive ở chế độ ai có link cũng xem được.</p>' +
        '<button class="btn sec" id="m_add">Thêm link vào job này</button></details>' +
        '<p class="muted">Gắn với job ' + esc(l.id) + ', không gắn với khách — để sau này còn biết ảnh của buổi nào.</p></div>';

      slot.querySelectorAll('img[data-ph]').forEach(function (im) {
        photoBlob(im.getAttribute('data-ph')).then(function (u) { im.src = u; })
          .catch(function () { im.removeAttribute('data-ph'); im.alt = 'Không tải được ảnh'; });
      });

      var stEl = $('#m_st');
      function runFiles(files) {
        var arr = Array.prototype.slice.call(files || []).filter(function (f) {
          return /^image\//.test(f.type) || /\.(jpe?g|png|webp|heic|heif)$/i.test(f.name);
        });
        if (!arr.length) return;
        var done = 0, last = null, fail = null;
        stEl.textContent = 'Đang tải ' + arr.length + ' ảnh…';
        // Tải từng cái một, không song song: 4G ở khách sạn bắn 5 request cùng lúc là rớt hết.
        arr.reduce(function (p, f) {
          return p.then(function () {
            if (fail) return;
            return shrinkImage(f, 1600, 0.75)
              .then(function (blob) { return uploadPhoto(l.id, blob, ''); })
              .then(function (r) { done++; last = r.media; stEl.textContent = 'Đã tải ' + done + '/' + arr.length; })
              .catch(function (e) { fail = e; });
          });
        }, Promise.resolve()).then(function () {
          if (fail) toast(fail.message, true); else toast('Đã thêm ' + done + ' ảnh vào job');
          if (last) draw(last);
        });
      }
      $('#m_cam').onclick = function () { $('#m_camf').click(); };
      $('#m_pick').onclick = function () { $('#m_pickf').click(); };
      $('#m_camf').onchange = function () { runFiles(this.files); this.value = ''; };
      $('#m_pickf').onchange = function () { runFiles(this.files); this.value = ''; };

      slot.querySelectorAll('[data-rm]').forEach(function (b) {
        b.onclick = function () {
          var u = b.getAttribute('data-rm');
          // Ảnh chụp tại chỗ: xoá là mất file thật. Link Drive thì chỉ gỡ liên kết. Hỏi trước khi mất.
          if (u.indexOf('/api/crm/media/') === 0 &&
              !window.confirm('Xoá ảnh này? File bị xoá hẳn khỏi kho, không khôi phục được.')) return;
          b.disabled = true;
          api('/leads/' + encodeURIComponent(l.id) + '/media', { method: 'DELETE', body: { url: u } })
            .then(function (r) { toast(r.note || 'Đã gỡ khỏi job'); draw(r.media); })
            .catch(function (e) { b.disabled = false; toast(e.message, true); });
        };
      });
      $('#m_add').onclick = function () {
        var url = $('#m_url').value.trim();
        if (!url) { toast('Dán link album trước đã', true); $('#m_url').focus(); return; }
        var btn = this; btn.disabled = true;
        api('/leads/' + encodeURIComponent(l.id) + '/media', { method: 'POST', body: {
          url: url, label: $('#m_label').value.trim(), kind: 'album', marketing_ok: $('#m_mk').checked === true
        } }).then(function (r) { toast('Đã thêm'); draw(r.media); })
          .catch(function (e) { btn.disabled = false; toast(e.message, true); });
      };
    }
    api('/leads/' + encodeURIComponent(l.id) + '/media')
      .then(function (d) { draw(d.media || []); })
      .catch(function () { /* endpoint chưa lên thì ẩn khối, không làm gãy trang */ });
  }

  /* ═══ CR-20260916-35 · HỒ SƠ BUỔI LÀM ════════════════════════════════
     Tân 16/09: "không có chỗ để xem hồ sơ lưu của khách... để lần sau khách biết muốn làm i
     như vậy, hay thay đổi chỉnh sửa, thử look mới."

     HAI LỚP, in ra màn hình cũng phải nhìn là biết đâu là đâu:
       nhãn "khách xem được" → tông + kiểu, lời nhắn, ảnh đã tick
       nhãn "chỉ nội bộ"     → khách thích/chê gì, lưu ý da tóc
     Kay phải thấy nhãn này ngay lúc ĐANG GÕ, không phải đi đọc tài liệu. Ghi thật lòng chỉ
     xảy ra khi người ghi chắc chắn khách không đọc được. */
  function lookMount(l) {
    var slot = $('#lookSlot'); if (!slot) return;
    api('/leads/' + encodeURIComponent(l.id) + '/look')
      .then(function (d) { lookDraw(l, d); })
      .catch(function (e) {
        // Chưa chạy migration 006 thì khối này chưa dùng được — nói thẳng, đừng ẩn đi.
        slot.innerHTML = '<div class="card"><h2>Hồ sơ buổi làm</h2><div class="miss">' + esc(e.message) + '</div></div>';
      });
  }

  function lookDraw(l, d) {
    var slot = $('#lookSlot'); if (!slot) return;
    var k = d.look || {}, pub = d.preview_khach_thay || {};
    function row(lab, val, internal) {
      return '<div class="lkrow"><div class="lklab">' + esc(lab) +
        (internal ? ' <span class="pill int">chỉ nội bộ</span>' : ' <span class="pill rep">khách xem được</span>') + '</div>' +
        '<div class="lkval' + (val ? '' : ' empty') + '">' + (val ? esc(val) : 'chưa ghi') + '</div></div>';
    }
    var nAnh = (pub.photos || []).length;
    var share = d.share_live
      ? '<div class="shbox on"><div class="shlab">Link gửi khách đang bật</div>' +
          '<div class="shurl">' + esc(location.origin + d.share_url) + '</div>' +
          '<div class="shbtns"><button class="btn sec sm" id="shCopy">Chép link</button>' +
          '<button class="btn sec sm" id="shNew">Đổi link mới</button>' +
          '<button class="btn sec sm danger" id="shOff">Thu hồi</button></div>' +
          '<p class="muted">Đang gửi <b>' + nAnh + ' ảnh</b>. Khách chỉ thấy tông, lời nhắn và đúng số ảnh này. ' +
          'Hai mục nội bộ ở trên không bao giờ ra.' +
          (nAnh ? '' : ' <b>Chưa tick ảnh nào nên khách mở ra chưa thấy ảnh.</b>') + '</p></div>'
      : '<div class="shbox"><div class="shlab">Chưa có link gửi khách</div>' +
          '<button class="btn sec" id="shOn">Tạo link gửi khách</button>' +
          '<p class="muted">Tạo xong vẫn phải tick từng ảnh mới gửi. Mặc định 0 ảnh.</p></div>';

    slot.innerHTML = '<div class="card"><div class="jh"><h2>Hồ sơ buổi làm</h2>' +
      '<button class="btn sec sm" id="lkEdit">Sửa</button></div>' +
      row('Tông + kiểu đã làm', k.tone, false) +
      (d.language === 'en' || k.tone_en ? row('Bản tiếng Anh (khách nước ngoài đọc bản này)', k.tone_en, false) : '') +
      row('Khách thích gì / chê gì', k.liked, true) +
      row('Lưu ý da / tóc', k.care, true) +
      (nAnh ? '<div style="margin-top:12px"><button class="btn bc" id="lkCard">Tạo card ảnh gửi khách (' + nAnh + ')</button>' +
              '<p class="muted" style="margin:6px 0 0">Ảnh PNG gửi thẳng vào WhatsApp / IG. Khách đăng lên trang cá nhân được — link thì không.</p></div>'
            : '<div style="margin-top:12px"><p class="muted">Tick ảnh trong mục Sửa để tạo được card ảnh gửi khách.</p></div>') +
      share + '</div>';

    $('#lkEdit').onclick = function () { lookSheet(l, d); };
    var cardBtn = $('#lkCard'); if (cardBtn) cardBtn.onclick = function () { lookCardSheet(l, d); };
    var on = $('#shOn'), nw = $('#shNew'), off = $('#shOff'), cp = $('#shCopy');
    function mkLink(btn, doiLink) {
      btn.disabled = true;
      api('/leads/' + encodeURIComponent(l.id) + '/share', { method: 'POST' })
        .then(function (r) { toast(doiLink ? 'Link cũ đã chết, đã có link mới' : 'Đã tạo link'); lookMount(l); })
        .catch(function (e) { btn.disabled = false; toast(e.message, true); });
    }
    if (on) on.onclick = function () { mkLink(on, false); };
    if (nw) nw.onclick = function () {
      if (!window.confirm('Đổi link mới? Link đã gửi cho khách sẽ chết ngay.')) return;
      mkLink(nw, true);
    };
    if (off) off.onclick = function () {
      if (!window.confirm('Thu hồi link? Khách đã lưu link cũng không mở được nữa.')) return;
      off.disabled = true;
      api('/leads/' + encodeURIComponent(l.id) + '/share', { method: 'DELETE' })
        .then(function (r) { toast(r.note || 'Đã thu hồi'); lookMount(l); })
        .catch(function (e) { off.disabled = false; toast(e.message, true); });
    };
    if (cp) cp.onclick = function () {
      var u = location.origin + d.share_url;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(u).then(function () { toast('Đã chép link'); },
          function () { toast('Không chép được, chọn tay ở ô trên', true); });
      } else toast('Trình duyệt không cho chép tự động, chọn tay ở ô trên', true);
    };
  }

  function lookSheet(l, d) {
    var k = d.look || {}, sh = k.share || {};
    api('/leads/' + encodeURIComponent(l.id) + '/media').then(function (md) {
      var photos = (md.media || []).filter(function (m) { return m && m.kind === 'photo'; });
      var chosen = {}; (sh.photos || []).forEach(function (p) { chosen[p] = true; });
      var bg = document.createElement('div'); bg.className = 'sheet-bg';
      bg.innerHTML = '<div class="sheet"><div class="grab"></div><h3>Hồ sơ buổi làm</h3>' +
        '<div class="muted">' + esc(l.customer_name) + (l.event_date ? ' · ' + dmy(l.event_date) : '') + '</div>' +
        '<div class="pkgrp" style="margin-top:14px">Bộ chọn look — bấm chọn, câu tiếng Việt và tiếng Anh ghép ra luôn</div>' +
        '<div class="pkbox" id="lk_pick"></div>' +
        '<label>Tông + kiểu đã làm <span class="pill rep">khách xem được</span></label>' +
        '<textarea id="lk_tone" placeholder="Tông ấm, mắt nâu khói, môi cam đất. Tóc búi thấp cài hoa baby">' + esc(k.tone || '') + '</textarea>' +
        '<label>Bản tiếng Anh <span class="pill rep">khách nước ngoài đọc bản này</span></label>' +
        '<textarea id="lk_tone_en" placeholder="Warm tones, smoky brown eyes, terracotta lips. Hair: a low chignon with baby\'s breath">' + esc(k.tone_en || '') + '</textarea>' +
        (state.ai ? '<div class="bcbtns" style="margin:0 0 10px"><button class="btn sec sm" id="lk_tr_tone">Dịch ô trên sang tiếng Anh</button></div>' : '') +
        '<label>Khách thích gì / chê gì <span class="pill int">chỉ nội bộ</span></label>' +
        '<textarea id="lk_liked" placeholder="Thích phần mắt. Chê môi nhạt hơn ảnh mẫu">' + esc(k.liked || '') + '</textarea>' +
        '<label>Lưu ý da / tóc <span class="pill int">chỉ nội bộ</span></label>' +
        '<textarea id="lk_care" placeholder="Da dầu vùng T, 3 tiếng là trôi. Tóc mỏng cần phồng chân">' + esc(k.care || '') + '</textarea>' +
        '<p class="muted" style="margin:2px 0 12px">Hai mục có nhãn <b>chỉ nội bộ</b> không bao giờ ra trang khách xem. Ghí thật để lần sau còn dùng được.</p>' +
        '<label>Lời nhắn gửi khách <span class="pill rep">khách xem được</span></label>' +
        '<textarea id="lk_note" placeholder="Cảm ơn chị đã tin tưởng KINKAY. Hẹn gặp lại chị dịp tới.">' + esc(sh.note || '') + '</textarea>' +
        '<label>Lời nhắn bản tiếng Anh <span class="pill rep">khách nước ngoài đọc bản này</span></label>' +
        '<textarea id="lk_note_en" placeholder="Thank you so much, Geia. It was lovely working with you.">' + esc(sh.note_en || '') + '</textarea>' +
        (state.ai ? '<div class="bcbtns" style="margin:0 0 10px"><button class="btn sec sm" id="lk_tr_note">Dịch ô trên sang tiếng Anh</button></div>' : '') +
        '<label>Ảnh gửi cho khách xem' + (photos.length ? ' (bấm để chọn)' : '') + '</label>' +
        (photos.length ? '<div class="thumbs pick" id="lk_ph"></div>'
                       : '<p class="muted">Job này chưa có ảnh chụp nào. Chụp ảnh ở khối trên rồi quay lại đây.</p>') +
        '<div class="bcbtns"><button class="btn sec" id="lk_cancel">Huỷ</button><button class="btn bc" id="lk_ok">Lưu hồ sơ</button></div></div>';
      document.body.appendChild(bg);

      var box = $('#lk_ph', bg);
      if (box) {
        box.innerHTML = photos.map(function (m) {
          return '<figure class="' + (chosen[m.key] ? 'on' : '') + '" data-k="' + esc(m.key) + '">' +
            '<img data-ph="' + esc(m.url) + '" alt=""><span class="tick">' + (chosen[m.key] ? '✓' : '') + '</span></figure>';
        }).join('');
        box.querySelectorAll('img[data-ph]').forEach(function (im) {
          photoBlob(im.getAttribute('data-ph')).then(function (u) { im.src = u; }).catch(function () { im.removeAttribute('data-ph'); });
        });
        box.querySelectorAll('figure[data-k]').forEach(function (f) {
          f.onclick = function () {
            var key = f.getAttribute('data-k');
            chosen[key] = !chosen[key];
            f.className = chosen[key] ? 'on' : '';
            f.querySelector('.tick').textContent = chosen[key] ? '✓' : '';
          };
        });
      }
      /* Bộ chọn KHÔNG tự ghi đè ô chữ. Kay bấm "Điền vào hai ô" mới ghi — vì có buổi Kay đã
         gõ tay một câu riêng, và mất câu đó vì lỡ chạm một chip là mất luôn niềm tin vào ô. */
      var sel = {};
      var pick = $('#lk_pick', bg);
      pick.innerHTML = LOOK_BANK.map(function (g) {
        return '<div class="pkgrp">' + esc(g.vi) + '</div><div class="chips" data-g="' + esc(g.k) + '">' +
          g.items.map(function (it, i) { return '<button type="button" class="chip" data-i="' + i + '">' + esc(it.vi) + '</button>'; }).join('') +
          '</div>';
      }).join('') +
      '<div class="pkout" id="lk_out"><b>Câu sẽ ghép ra</b><span class="em">Chưa chọn mục nào.</span></div>' +
      '<div class="bcbtns" style="margin:10px 0 0"><button type="button" class="btn sec sm" id="lk_fill">Điền vào hai ô</button>' +
      '<button type="button" class="btn sec sm" id="lk_clear">Bỏ chọn hết</button></div>';

      function redraw() {
        var r = composeLook(sel);
        $('#lk_out', bg).innerHTML = '<b>Câu sẽ ghép ra</b>' +
          (r.en || r.vi
            ? '<div>' + esc(r.en || '—') + '</div><div class="em" style="margin-top:4px">' + esc(r.vi || '—') + '</div>'
            : '<span class="em">Chưa chọn mục nào.</span>');
      }
      pick.querySelectorAll('.chips').forEach(function (row) {
        var gk = row.getAttribute('data-g');
        row.querySelectorAll('.chip').forEach(function (b) {
          b.onclick = function () {
            var i = +b.getAttribute('data-i');
            sel[gk] = sel[gk] || [];
            var at = sel[gk].indexOf(i);
            if (at >= 0) { sel[gk].splice(at, 1); b.classList.remove('on'); }
            else { sel[gk].push(i); b.classList.add('on'); }
            redraw();
          };
        });
      });
      $('#lk_fill', bg).onclick = function () {
        var r = composeLook(sel);
        if (!r.vi && !r.en) { toast('Chưa chọn mục nào', true); return; }
        $('#lk_tone', bg).value = r.vi; $('#lk_tone_en', bg).value = r.en;
        toast('Đã điền. Sửa thêm rồi bấm Lưu hồ sơ.');
      };
      $('#lk_clear', bg).onclick = function () {
        sel = {}; pick.querySelectorAll('.chip.on').forEach(function (b) { b.classList.remove('on'); }); redraw();
      };

      /* Máy dịch đổ chữ vào ô cho Kay đọc, KHÔNG tự lưu. Giữa model và khách phải có một con mắt. */
      function bindTr(btnId, srcId, dstId, kind) {
        var b = $(btnId, bg); if (!b) return;
        b.onclick = function () {
          var src = $(srcId, bg).value.trim();
          if (!src) { toast('Ô tiếng Việt đang trống', true); return; }
          b.disabled = true; var old = b.textContent; b.textContent = 'Đang dịch…';
          api('/translate', { method: 'POST', body: { text: src, kind: kind } })
            .then(function (r) { $(dstId, bg).value = r.text || ''; toast('Đã dịch. Đọc lại rồi bấm Lưu.'); })
            .catch(function (e) { toast(e.message, true); })
            .then(function () { b.disabled = false; b.textContent = old; });
        };
      }
      bindTr('#lk_tr_tone', '#lk_tone', '#lk_tone_en', 'tone');
      bindTr('#lk_tr_note', '#lk_note', '#lk_note_en', 'note');

      bg.addEventListener('click', function (e) { if (e.target === bg) bg.remove(); });
      $('#lk_cancel', bg).onclick = function () { bg.remove(); };
      $('#lk_ok', bg).onclick = function () {
        var btn = this; btn.disabled = true; btn.textContent = 'Đang lưu…';
        var body = { look: {
          tone: $('#lk_tone', bg).value.trim(),
          tone_en: $('#lk_tone_en', bg).value.trim(),
          liked: $('#lk_liked', bg).value.trim(),
          care: $('#lk_care', bg).value.trim(),
          share: { note: $('#lk_note', bg).value.trim(),
                   note_en: $('#lk_note_en', bg).value.trim(),
                   photos: Object.keys(chosen).filter(function (x) { return chosen[x]; }) }
        } };
        api('/leads/' + encodeURIComponent(l.id) + '/look', { method: 'PATCH', body: body })
          .then(function () { bg.remove(); toast('Đã lưu hồ sơ'); lookMount(l); })
          .catch(function (e) { btn.disabled = false; btn.textContent = 'Lưu hồ sơ'; toast(e.message, true); });
      };
    }).catch(function (e) { toast(e.message, true); });
  }

  /* ═══ CR-20260916-36 · BỘ CHỌN LOOK + CARD ẢNH GỬI KHÁCH ═════════════════
     Tân 16/09: "Kay không giỏi tiếng Anh lắm, khách thì 100% người nước ngoài" và
     "tại sao không gửi hình như cái confirmation card mà lại gửi link? gửi hình khách còn
     post social được."

     HAI VẤN ĐỀ, MỘT GỐC. Hồ sơ buổi làm trước đó ra đời dưới dạng LINK vì nó có nhiều ảnh,
     mà nhiều ảnh thì gallery là hình dạng dễ code nhất. Nhưng chân trang của link ghi đúng
     câu "keep the link private" — tức là tự tay chặn thứ duy nhất sinh ra khách mới: khách
     khoe. Không ai repost một cái URL. Thứ khách đăng lên Instagram sau một buổi gala là
     TẤM ẢNH. Nên từ CR-36 card ảnh là đường gửi chính, link ở lại làm đường phụ cho ca nhiều
     ảnh và cho nút Message KINKAY.

     Câu mô tả look in trên card phải là tiếng Anh. Dịch máy tiếng Việt ngành makeup ra tiếng
     Anh thường ra chữ dở, nên lớp chính KHÔNG phải máy dịch mà là bộ chọn: look lặp lại, Kay
     bấm chọn, câu tiếng Anh ghép ra luôn đúng giọng thương hiệu và không tốn một đồng nào.
     Máy dịch chỉ đỡ phần Kay gõ tay ngoài bộ chọn, và chỉ bật khi Cloudflare có binding AI. */

  // Bộ từ vựng. Mỗi mục là một cặp vi/en đã viết sẵn cho đúng — không dịch lúc chạy.
  // Thêm mục mới cứ thêm vào đây; không có phần nào khác cần sửa theo.
  var LOOK_BANK = [

    { k: 'accent', vi: 'Điểm nhấn', items: [
      { vi: 'nhũ vàng khoé mắt trong',   en: 'gold shimmer on the inner corners' },
      { vi: 'nhũ champagne giữa mí',     en: 'champagne shimmer on the lid centre' },
      { vi: 'ánh ngọc trai nhẹ',         en: 'a soft pearl sheen' },

      { vi: 'mi giả tự nhiên',           en: 'natural individual lashes' },
      { vi: 'mi giả dày kiểu dạ tiệc',   en: 'full glam lashes' }
    ] },
    { k: 'cheeks', vi: 'Má', items: [
      { vi: 'hồng đào nhẹ',           en: 'soft peach' },

    { k: 'lips', vi: 'Môi', items: [
      { vi: 'cam đất',                en: 'terracotta' },

      { vi: 'đỏ berry tươi',          en: 'bright berry' },
      { vi: 'nude ấm',                en: 'warm nude' },

    { k: 'hair', vi: 'Tóc', items: [

      { vi: 'sóng lơi thả tự nhiên',       en: 'soft loose waves' },
      { vi: 'tóc thẳng bóng rẽ ngôi giữa', en: 'sleek centre-parted hair' },
      { vi: 'nửa buộc nửa thả',            en: 'a half-up style' },

    ] }
  ];

  function lkJoin(arr, lang) {
    if (!arr.length) return '';
    if (arr.length === 1) return arr[0];
    return arr.slice(0, -1).join(', ') + (lang === 'en' ? ' and ' : ' và ') + arr[arr.length - 1];
  }
  function lkCap(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }

  /* sel = { base:[idx...], eyes:[...], ... } → { vi, en }.
     Câu ghép theo khung cố định nên không bao giờ ra chữ ngô nghê, đổi lại là không linh hoạt.
     Đúng đánh đổi cần: Kay bấm 5 giây ra câu dùng được luôn, ca lạ thì gõ tay. */
  function composeLook(sel) {
    function pick(k, lang) {
      var g = null; LOOK_BANK.forEach(function (x) { if (x.k === k) g = x; });
      var ids = sel[k] || [];
      return ids.map(function (i) { return g.items[i][lang]; });
    }
    function build(lang) {
      var en = lang === 'en', seg = [];
      var base = pick('base', lang), eyes = pick('eyes', lang), acc = pick('accent', lang),
          ch = pick('cheeks', lang), lip = pick('lips', lang), hair = pick('hair', lang);
      if (base.length) seg.push((en ? '' : 'nền da ') + lkJoin(base, lang) + (en ? ' base' : ''));
      if (eyes.length || acc.length) {
        var e = eyes.length ? (en ? lkJoin(eyes, lang) + ' eyes' : 'mắt ' + lkJoin(eyes, lang)) : '';
        if (acc.length) e = e ? e + (en ? ' with ' : ', ') + lkJoin(acc, lang) : (en ? lkJoin(acc, lang) : lkJoin(acc, lang));
        seg.push(e);
      }
      if (ch.length)  seg.push((en ? lkJoin(ch, lang) + ' cheeks' : 'má ' + lkJoin(ch, lang)));
      if (lip.length) seg.push((en ? lkJoin(lip, lang) + ' lips' : 'môi ' + lkJoin(lip, lang)));
      var out = seg.length ? lkCap(seg.join(', ')) + '.' : '';
      if (hair.length) out = (out ? out + ' ' : '') + (en ? 'Hair: ' : 'Tóc: ') + lkJoin(hair, lang) + '.';
      return out;
    }
    return { vi: build('vi'), en: build('en') };
  }

  /* Hỏi server một lần lúc khởi động: Cloudflare đã có binding AI chưa. Chưa có thì nút Dịch
     KHÔNG hiện. Một nút bấm vào là báo lỗi còn tệ hơn không có nút. */
  function aiProbe() {
    api('/translate').then(function (r) { state.ai = !!(r && r.available); })
      .catch(function () { state.ai = false; });
  }

  /* ---------- CARD ẢNH 1080×1350 ----------
     Tân 16/09 xem bản đầu (ảnh tràn khung + dải thương hiệu dưới) và không thích. Anh chụp màn
     hình chính trang /xem/ rồi bảo: làm như cái này, nhiều ảnh, có câu cảm ơn, có thông tin
     KINKAY. Nên bản này bám đúng bố cục trang khách đã duyệt.

     KHÁC TRANG WEB ĐÚNG HAI CHỖ, cả hai đều có lý do:
       · Bỏ nút "Nhắn cho KINKAY" — trên một tấm ảnh thì bấm vào không ra gì.
       · Bỏ câu "giữ link riêng tư" — tấm ảnh này sinh ra ĐỂ khách đăng; in câu đó lên là tự
         chặn đúng mục đích của nó. Thay bằng kinkay.vn · @kinkay.official · số điện thoại.

     Máy vẽ vẫn là máy của Booking Confirmation: cùng khổ 1080×1350, cùng font tự host, cùng
     đường canvas → PNG → Web Share, cùng đường lưu ảnh riêng cho iPhone.

     KHÔNG in lên card: giá, cọc, `liked`, `care`, ghi chú nội bộ. Nguồn chữ duy nhất là
     `publicLook()` — đúng cái cửa mà trang khách dùng. */
  var LC = {
    W: 1080, H: 1350, PAD: 64, GAP: 20, RAD: 20, CPAD: 30, MAXPH: 4,
    bg: '#FAF7F2', card: '#FFFFFF', ink: '#3D342B', mute: '#8A7D6D', line: '#EADFD0', gold: '#B08D3F'
  };
  var LC_T = {
    vi: { look: 'TÔNG + KIỂU ĐÃ LÀM', photos: 'HÌNH ẢNH BUỔI NÀY', before: 'TRƯỚC', after: 'SAU' },
    en: { look: 'THE LOOK WE CREATED', photos: 'PHOTOS FROM THIS SESSION', before: 'BEFORE', after: 'AFTER' }
  };
  var LC_FOOT = 'kinkay.vn · @kinkay.official · 0933 953 179';

  function lcLoadImg(url) {
    return photoBlob(url).then(function (u) {
      return new Promise(function (res, rej) {
        var im = new Image();
        im.onload = function () { res(im); };
        im.onerror = function () { rej(new Error('Không dựng được ảnh')); };
        im.src = u;
      });
    });
  }
  function lcRound(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y); ctx.closePath();
  }
  function lcCover(ctx, img, x, y, w, h, r) {
    ctx.save(); lcRound(ctx, x, y, w, h, r); ctx.clip();
    ctx.fillStyle = '#EFE9E2'; ctx.fillRect(x, y, w, h);
    var s = Math.max(w / img.width, h / img.height), dw = img.width * s, dh = img.height * s;
    // Neo 1/3 trên chứ không canh giữa: mặt người nằm ở phần trên khung ảnh chân dung.
    ctx.drawImage(img, x + (w - dw) / 2, y + (h - dh) * 0.32, dw, dh);
    ctx.restore();
  }
  function lcTag(ctx, text, x, y, w, h) {
    ctx.save(); lcRound(ctx, x, y, w, h, 12); ctx.clip();
    var g = ctx.createLinearGradient(0, y + h - 96, 0, y + h);
    g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.55)');
    ctx.fillStyle = g; ctx.fillRect(x, y + h - 96, w, 96);
    ctx.fillStyle = '#fff'; ctx.font = '500 20px "Be Vietnam Pro", system-ui, sans-serif';
    ctx.textAlign = 'left'; spaced(ctx, text, x + 18, y + h - 20, 3, 'left');
    ctx.restore();
  }

  /* imgs = mảng Image (tối đa 4) · info = { name, meta, note, tone, lang, tags }
     Chữ đo trước, ảnh ăn phần đất còn lại. Câu look dài thì ảnh thấp xuống chứ không bao giờ
     tràn khung; hết đường co chữ thì CẮT CHỮ, không cắt ảnh — ảnh mới là thứ khách đăng. */
  function lcRender(imgs, info) {
    var c = document.createElement('canvas'); c.width = LC.W; c.height = LC.H;
    var ctx = c.getContext('2d');
    var T = LC_T[info.lang === 'en' ? 'en' : 'vi'];
    var W = LC.W, P = LC.PAD, CW = W - P * 2, IW = CW - LC.CPAD * 2;
    var FOOT = 118;

    ctx.fillStyle = LC.bg; ctx.fillRect(0, 0, W, LC.H);
    ctx.textBaseline = 'alphabetic';

    ctx.textAlign = 'center'; ctx.fillStyle = LC.gold;
    ctx.font = '500 20px "Be Vietnam Pro", system-ui, sans-serif';
    spaced(ctx, 'KINKAY MAKEUP & HAIR', W / 2, 74, 6, 'center');

    ctx.textAlign = 'left';
    var ns = 54;
    ctx.font = '500 ' + ns + 'px "Playfair Display", Georgia, serif';
    while (ctx.measureText(info.name || '').width > CW && ns > 34) {
      ns -= 3; ctx.font = '500 ' + ns + 'px "Playfair Display", Georgia, serif';
    }
    ctx.fillStyle = LC.ink; ctx.fillText(info.name || '', P, 160);
    ctx.fillStyle = LC.mute; ctx.font = '300 25px "Be Vietnam Pro", system-ui, sans-serif';
    ctx.fillText(info.meta || '', P, 202);

    var fsNote = 27, fsLook = 28, noteL = [], lookL = [], hNote = 0, hLook = 0, gridH = 0;
    var y0 = 240, nPh = Math.min(imgs.length, LC.MAXPH), labelH = 30, labelGap = 18;

    function measure() {
      ctx.font = 'italic 300 ' + fsNote + 'px "Be Vietnam Pro", system-ui, sans-serif';
      noteL = info.note ? wrapLines(ctx, info.note, IW) : [];
      ctx.font = '300 ' + fsLook + 'px "Be Vietnam Pro", system-ui, sans-serif';
      lookL = info.tone ? wrapLines(ctx, info.tone, IW) : [];
      hNote = noteL.length ? LC.CPAD * 2 + noteL.length * Math.round(fsNote * 1.5) : 0;
      hLook = lookL.length ? LC.CPAD * 2 + labelH + labelGap + lookL.length * Math.round(fsLook * 1.5) : 0;
      var chrome = LC.CPAD * 2 + labelH + labelGap;
      gridH = LC.H - (y0 + (hNote ? hNote + LC.GAP : 0) + (hLook ? hLook + LC.GAP : 0) + chrome + FOOT);
    }
    measure();
    while (gridH < 430 && (fsNote > 22 || fsLook > 23)) {
      if (fsNote > 22) fsNote--; if (fsLook > 23) fsLook--; measure();
    }
    if (gridH < 430) {
      var over = Math.ceil((430 - gridH) / Math.round(fsLook * 1.5));
      if (lookL.length > 2) {
        var keep = Math.max(2, lookL.length - over);
        if (keep < lookL.length) { lookL = lookL.slice(0, keep); lookL[keep - 1] = lookL[keep - 1].replace(/\s+\S*$/, '') + '…'; }
      }
      measure(); if (gridH < 430) gridH = 430;
    }

    var y = y0;
    function cardBox(h) {
      ctx.fillStyle = LC.card; lcRound(ctx, P, y, CW, h, LC.RAD); ctx.fill();
      ctx.strokeStyle = LC.line; ctx.lineWidth = 1; lcRound(ctx, P + .5, y + .5, CW - 1, h - 1, LC.RAD); ctx.stroke();
    }
    function label(txt, ty) {
      ctx.fillStyle = LC.mute; ctx.font = '500 19px "Be Vietnam Pro", system-ui, sans-serif';
      ctx.textAlign = 'left'; spaced(ctx, txt, P + LC.CPAD, ty, 2.4, 'left');
    }

    if (hNote) {
      cardBox(hNote);
      ctx.fillStyle = '#5C5044'; ctx.font = 'italic 300 ' + fsNote + 'px "Be Vietnam Pro", system-ui, sans-serif';
      ctx.textAlign = 'left';
      var lh = Math.round(fsNote * 1.5);
      noteL.forEach(function (ln, i) { ctx.fillText(ln, P + LC.CPAD, y + LC.CPAD + fsNote + i * lh); });
      y += hNote + LC.GAP;
    }
    if (hLook) {
      cardBox(hLook);
      label(T.look, y + LC.CPAD + 19);
      ctx.fillStyle = LC.ink; ctx.font = '300 ' + fsLook + 'px "Be Vietnam Pro", system-ui, sans-serif';
      var lh2 = Math.round(fsLook * 1.5);
      lookL.forEach(function (ln, i) { ctx.fillText(ln, P + LC.CPAD, y + LC.CPAD + labelH + labelGap + fsLook + i * lh2); });
      y += hLook + LC.GAP;
    }

    cardBox(LC.CPAD * 2 + labelH + labelGap + gridH);
    label(T.photos, y + LC.CPAD + 19);
    var gx = P + LC.CPAD, gy = y + LC.CPAD + labelH + labelGap, g = 14;
    if (nPh === 1) {
      lcCover(ctx, imgs[0], gx, gy, IW, gridH, 12);
    } else if (nPh === 2) {
      var w2 = (IW - g) / 2;
      lcCover(ctx, imgs[0], gx, gy, w2, gridH, 12);
      lcCover(ctx, imgs[1], gx + w2 + g, gy, w2, gridH, 12);
      if (info.tags) { lcTag(ctx, T.before, gx, gy, w2, gridH); lcTag(ctx, T.after, gx + w2 + g, gy, w2, gridH); }
    } else if (nPh === 3) {
      /* Một ảnh lớn bên trái, hai ảnh nhỏ xếp bên phải. Ba ảnh dàn ngang thì mỗi khung hẹp quá,
         cắt mất hai bên mặt — đúng thứ không được phép hỏng trên card của thợ trang điểm. */
      var wL = Math.round(IW * 0.6), wR = IW - wL - g, hR = (gridH - g) / 2;
      lcCover(ctx, imgs[0], gx, gy, wL, gridH, 12);
      lcCover(ctx, imgs[1], gx + wL + g, gy, wR, hR, 12);
      lcCover(ctx, imgs[2], gx + wL + g, gy + hR + g, wR, hR, 12);
    } else {
      var w4 = (IW - g) / 2, h4 = (gridH - g) / 2;
      lcCover(ctx, imgs[0], gx, gy, w4, h4, 12);
      lcCover(ctx, imgs[1], gx + w4 + g, gy, w4, h4, 12);
      lcCover(ctx, imgs[2], gx, gy + h4 + g, w4, h4, 12);
      lcCover(ctx, imgs[3], gx + w4 + g, gy + h4 + g, w4, h4, 12);
    }

    ctx.strokeStyle = LC.line; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(W / 2 - 120, LC.H - 78); ctx.lineTo(W / 2 + 120, LC.H - 78); ctx.stroke();
    ctx.textAlign = 'center'; ctx.fillStyle = LC.mute;
    ctx.font = '300 23px "Be Vietnam Pro", system-ui, sans-serif';
    ctx.fillText(LC_FOOT, W / 2, LC.H - 34);
    return c;
  }

  /* Sheet xem trước + chia sẻ. Kay chọn tối đa 4 ảnh trong số ảnh đã tick — 4 là trần cứng:
     thêm nữa thì mỗi khung bé tới mức không nhìn ra mặt ai, mà mặt mới là sản phẩm.
     Đúng 2 ảnh thì hiện thêm lựa chọn ghi nhãn TRƯỚC / SAU. */
  function lookCardSheet(lead, d) {
    var isEn = d.language === 'en';
    var pub = (isEn ? d.preview_khach_en : d.preview_khach_thay) || {};
    var keys = pub.photos || [];
    if (!keys.length) { toast('Chưa tick ảnh nào. Bấm Sửa, chọn ảnh, lưu rồi quay lại.', true); return; }

    api('/leads/' + encodeURIComponent(lead.id) + '/media').then(function (md) {
      var byKey = {}; (md.media || []).forEach(function (m) { if (m && m.key) byKey[m.key] = m.url; });
      var list = keys.filter(function (k) { return byKey[k]; });
      if (!list.length) { toast('Không tải được ảnh đã tick', true); return; }

      var when = lead.event_date ? (isEn ? lcEnDate(lead.event_date) : dmy(lead.event_date)) : '';
      var info = {
        name: lead.customer_name || '',
        meta: [lead.service || '', when].filter(Boolean).join(' · '),
        note: pub.note || '', tone: pub.tone || '',
        lang: isEn ? 'en' : 'vi', tags: false
      };

      var chosen = list.slice(0, Math.min(LC.MAXPH, list.length));   // mặc định lấy các ảnh đầu
      var CACHE = {};
      function getImg(k) { return CACHE[k] || (CACHE[k] = lcLoadImg(byKey[k])); }

      var wrap = document.createElement('div'); wrap.className = 'sheet-bg';
      wrap.innerHTML = '<div class="sheet"><div class="grab"></div><h3>Card ảnh gửi khách</h3>' +
        '<div class="muted">' + esc(info.name) + ' · card ' + (isEn ? 'tiếng Anh' : 'tiếng Việt') + '</div>' +
        (list.length > 1 ? '<label style="margin-top:10px">Chọn ảnh lên card (tối đa ' + LC.MAXPH + ')</label><div class="lcstrip" id="lcStrip"></div>' : '') +
        '<div id="lcTagRow" hidden><label class="lcchk"><input type="checkbox" id="lcTags"> Ghi nhãn TRƯỚC / SAU lên 2 ảnh</label></div>' +
        '<div class="bcbtns" style="margin-top:8px"><button class="btn bc" id="lcShare" disabled>Đang tạo ảnh…</button>' +
        '<button class="btn sec" id="lcSave" disabled>Lưu ảnh</button><button class="btn sec" id="lcClose">Đóng</button></div>' +
        '<div class="bcprev" id="lcWrap" style="margin-top:10px"><div class="empty">⏳ Đang tạo ảnh 1080×1350…</div></div>' +
        '<p class="muted">Card in câu cảm ơn, tông + kiểu đã làm, ảnh và thông tin KINKAY. ' +
        '<b>Không in giá, không in ghi chú nội bộ.</b> Khách đăng lên trang cá nhân thì thương hiệu đi theo.</p></div>';
      document.body.appendChild(wrap);

      var sheetEl = $('.sheet', wrap), blob = null, gen = 0;

      var strip = $('#lcStrip', wrap);
      function paintStrip() {
        if (!strip) return;
        strip.querySelectorAll('img[data-k]').forEach(function (im) {
          im.className = chosen.indexOf(im.getAttribute('data-k')) >= 0 ? 'on' : '';
        });
        var row = $('#lcTagRow', wrap);
        if (row) { row.hidden = chosen.length !== 2; if (row.hidden) { $('#lcTags', wrap).checked = false; info.tags = false; } }
      }
      if (strip) {
        strip.innerHTML = list.map(function (k) { return '<img data-ph="' + esc(byKey[k]) + '" data-k="' + esc(k) + '" alt="">'; }).join('');
        strip.querySelectorAll('img[data-k]').forEach(function (im) {
          photoBlob(im.getAttribute('data-ph')).then(function (u) { im.src = u; }).catch(function () { });
          im.onclick = function () {
            var k = im.getAttribute('data-k'), at = chosen.indexOf(k);
            if (at >= 0) { if (chosen.length === 1) { toast('Phải giữ ít nhất 1 ảnh', true); return; } chosen.splice(at, 1); }
            else { if (chosen.length >= LC.MAXPH) { toast('Tối đa ' + LC.MAXPH + ' ảnh trên một card', true); return; } chosen.push(k); }
            paintStrip(); run();
          };
        });
      }
      paintStrip();
      $('#lcTags', wrap).onchange = function () { info.tags = this.checked; run(); };

      function run() {
        var my = ++gen; blob = null;
        $('#lcShare', wrap).disabled = true; $('#lcShare', wrap).textContent = 'Đang tạo ảnh…';
        $('#lcSave', wrap).disabled = true;
        $('#lcWrap', wrap).innerHTML = '<div class="empty">⏳ Đang tạo ảnh 1080×1350…</div>';
        Promise.all([bcFontsReadyTimeout()].concat(chosen.map(getImg))).then(function (r) {
          if (my !== gen) return;                        // Kay đổi lựa chọn giữa chừng
          var canvas = lcRender(r.slice(1), info);
          $('#lcWrap', wrap).innerHTML = ''; $('#lcWrap', wrap).appendChild(canvas);
          return bcToBlob(canvas);
        }).then(function (b) {
          if (!b || my !== gen) return;
          blob = b;

        if (!blob) { bcShowErr(sheetEl, 'Ảnh chưa sẵn sàng, đợi vài giây.'); return; }

            .then(function () { toast('Đã mở chia sẻ'); })

      };
      $('#lcSave', wrap).onclick = function () { if (blob) bcSaveBlob(blob, fname(), sheetEl); };
      $('#lcClose', wrap).onclick = function () { wrap.remove(); };
      wrap.addEventListener('click', function (e) { if (e.target === wrap) wrap.remove(); });

      '<div class="card"><h2>Cách dùng 60 giây</h2><p class="muted">1. Hôm nay → bấm khách đến hạn. 2. Đổi trạng thái, ghi 1 việc tiếp, chọn hẹn. 3. Ghi 1 dòng vừa xảy ra. 4. Lưu. Có tiền thì chỉ điền khi đã chắc; Tân bật "Đã xác minh".</p></div>';
    shell('', html, 'more');
    app.querySelectorAll('[data-x]').forEach(function (b) {
      b.onclick = function () {
        var what = b.getAttribute('data-x');
        fetch(API + '/export?what=' + what, { headers: state.token ? { Authorization: 'Bearer ' + state.token } : {} }).then(function (r) { if (!r.ok) throw new Error('Lỗi ' + r.status); return r.blob(); })
          .then(function (blob) { var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'kinkay-crm-' + what + '-' + todayVN() + '.csv'; document.body.appendChild(a); a.click(); a.remove(); })
          .catch(function (e) { toast(e.message, true); });
      };
    });
    $('#btnOut').onclick = function () { logout(); };
    trashMount();
  }
  function trashMount() {
    Promise.all([api('/trash?entity=lead'), api('/trash?entity=partner')]).then(function (rs) {
      var slot = $('#trashSlot'); if (!slot) return;
      var items = rs[0].items.concat(rs[1].items).sort(function (a, b) { return String(b.deleted_at).localeCompare(String(a.deleted_at)); });
      slot.innerHTML = items.length ? items.map(function (it) {
        return '<div class="row" style="cursor:default"><div class="main"><div class="t">' + esc(it.name) + (it.status ? ' ' + pill(it.status) : '') + '</div>' +
          '<div class="s">' + esc([it.id, it.service, it.event_date ? dmy(it.event_date) : '', it.reason].filter(Boolean).join(' · ')) + '</div>' +
          '<div class="s">Xoá ' + esc(String(it.deleted_at || '').replace('T', ' ').slice(0, 16)) + ' · ' + esc(it.deleted_by || '') + '</div></div>' +
          '<div class="right"><button class="btn sec sm" data-restore="' + esc(it.entity + '|' + it.id) + '">Khôi phục</button></div></div>';
      }).join('') : '<div class="empty">Chưa xoá gì</div>';
      slot.querySelectorAll('[data-restore]').forEach(function (b) {
        b.onclick = function () {
          var pr = b.getAttribute('data-restore').split('|'); b.disabled = true;
          api('/trash', { method: 'POST', body: { entity: pr[0], id: pr[1] } })
            .then(function () { toast('Đã khôi phục ' + pr[1]); if (state.lastDeleted && state.lastDeleted.id === pr[1]) state.lastDeleted = null; location.hash = (pr[0] === 'lead' ? '#/lead/' : '#/partner/') + pr[1]; })
            .catch(function (e) { b.disabled = false; toast(e.message, true); });
        };
      });
    }).catch(function (e) { var slot = $('#trashSlot'); if (slot) slot.innerHTML = '<div class="warn">' + esc(e.message) + '</div>'; });
  }


  // ================= Booking Confirmation (CR-20260907-29) =================
  // Luồng: Lead → "Tạo Booking Confirmation" → kiểm tra thiếu gì → sheet điền phần thiếu → POST snapshot V(n)
  //        → vẽ canvas 1080×1350 (client, không thư viện) → Chia sẻ (Web Share API file) / Lưu ảnh / Sửa & tạo lại.
  // Snapshot là bản lịch sử: vẽ lại từ snapshot_json, không từ lead hiện tại.
  var BC = { W: 1080, H: 1350, dark: '#1A0F08', cream: '#FAF0E4', gold: '#C4A882', gold2: '#8F7340', ink: '#2A2622', mute: '#7B736A', line: '#E4D8C8' };
  var BC_ELIGIBLE = ['Quoted', 'Hold', 'Deposit Paid', 'Confirmed'];
  var BC_LABEL = { customer_name: 'Tên khách', service: 'Dịch vụ', event_date: 'Ngày sự kiện', ready_time: 'Giờ hẹn', venue: 'Địa điểm', line_items: 'Bảng giá (dòng dịch vụ)', total_fee: 'Tổng phí', deposit_mode: 'Cọc', deposit_amount: 'Số tiền cọc' };
  // CR-33: nhan trang thai phat hanh. 'active' moi gui duoc.
  var BC_ST = { active: '', superseded: 'Đã thay thế', voided: 'BẢN SAI — không gửi' };

  function bcMount(lead) {
    var slot = $('#bcSlot'); if (!slot) return;
    if (BC_ELIGIBLE.indexOf(lead.status) < 0) return;
    api('/leads/' + encodeURIComponent(lead.id) + '/confirmations').then(function (d) {
      var strong = lead.status === 'Confirmed' || lead.status === 'Deposit Paid';
      var h = '<div class="card"><h2>Booking Confirmation<b>' + d.versions.length + '</b></h2>' +
        '<button class="btn bc' + (strong ? '' : ' soft') + '" id="bcGo">' + (d.versions.length ? 'Tạo bản mới (V' + (d.versions.length + 1) + ')' : 'Tạo Booking Confirmation') + '</button>' +
        (d.missing.length ? '<div class="muted" style="margin-top:6px">Còn thiếu: ' + d.missing.map(function (k) { return BC_LABEL[k] || k; }).join(', ') + ' → sẽ hỏi khi bấm.</div>' : '<div class="muted" style="margin-top:6px">Đủ thông tin, bấm là ra bản xem trước.</div>') +
        (d.versions.length ? '<div class="hist" style="margin-top:8px">' + d.versions.map(function (v) {
          // Trang thai doc tu cot DB, KHONG suy ra tu "version cao nhat".
          var st = v.status || 'active', sendable = (st === 'active');
          var tag = st === 'voided'
            ? '<b style="color:#B3261E"> · ' + BC_ST.voided + '</b>'
            : (st === 'superseded' ? '<span class="muted"> · ' + BC_ST.superseded + (v.superseded_by_id ? ' bởi ' + esc(String(v.superseded_by_id).split('-').pop()) : '') + '</span>' : '');
          return '<div style="display:flex;justify-content:space-between;align-items:center;gap:6px;' + (sendable ? '' : 'opacity:.72') + '">'
            + '<span>' + esc(v.id) + ' · ' + esc(dmy(v.generated_at)) + ' · ' + esc(v.generated_by || '') + (v.language ? ' · ' + (v.language === 'en' ? 'EN' : 'VI') : '') + tag + '</span>'
            + '<span style="display:flex;gap:6px;flex-shrink:0">'
            + '<button class="btn sec sm" data-bcv="' + esc(v.id) + '" data-bcst="' + esc(st) + '">' + (sendable ? 'Xem / gửi lại' : 'Xem') + '</button>'
            /* CR-20260916-36: API đổi trạng thái có từ CR-33 nhưng chưa bao giờ có nút bấm nó.
               Hệ quả: một bản in sai phạm vi đã bán vẫn nằm đó với nút "gửi lại", và cách duy nhất
               để chặn là gõ SQL thẳng vào database production. Thiết kế xong mà không có đường bấm
               thì coi như chưa làm.
               'superseded' vẫn do server tự đặt khi phát hành bản mới — không đặt tay được, đúng
               luật CR-33. Ở đây chỉ có voided (bản SAI Dữ KIỆN) và gỡ voided. */
            + (st === 'voided'
                ? (v.superseded_by_id ? '' : '<button class="btn sec sm" data-bcun="' + esc(v.id) + '">Bỏ đánh dấu</button>')
                : '<button class="btn sec sm danger" data-bcvoid="' + esc(v.id) + '">Đánh dấu sai</button>')
            + '</span></div>';
        }).join('') + '</div>' : '') + '</div>';
      slot.innerHTML = h;
      $('#bcGo').onclick = function () { bcForm(lead, d.booking, d.missing, false, d.language); };
      slot.querySelectorAll('[data-bcv]').forEach(function (b) { b.onclick = function () { api('/confirmations/' + encodeURIComponent(b.getAttribute('data-bcv'))).then(function (r) { bcPreview(lead, r.confirmation.snapshot, true, r.confirmation.status || b.getAttribute('data-bcst') || 'active'); }).catch(function (e) { toast(e.message, true); }); }; });
      slot.querySelectorAll('[data-bcvoid]').forEach(function (b) { b.onclick = function () { bcVoidSheet(lead, b.getAttribute('data-bcvoid')); }; });
      slot.querySelectorAll('[data-bcun]').forEach(function (b) {
        b.onclick = function () {
          if (!window.confirm('Bỏ đánh dấu sai cho ' + b.getAttribute('data-bcun') + '? Bản này sẽ gửi lại được.')) return;
          b.disabled = true;
          api('/confirmations/' + encodeURIComponent(b.getAttribute('data-bcun')), { method: 'POST', body: { status: 'active' } })
            .then(function () { toast('Đã bỏ đánh dấu'); bcMount(lead); })
            .catch(function (e) { b.disabled = false; toast(e.message, true); });
        };
      });
    }).catch(function (e) { slot.innerHTML = '<div class="warn">' + esc(e.message) + '</div>'; });
  }

  /* Đánh dấu một bản xác nhận là SAI Dữ KIỆN.
     KHÔNG sửa snapshot — bản đã phát hành là bất biến, kể cả khi nội dung sai. Khách đã
     cầm tờ đó trên tay rồi; sửa lại lịch sử là tự nói dối mình. Chỉ chặn đường gửi lại.
     BẮT BUỘC ghi lý do: sau này mở ra phải biết vì sao nó bị chặn, không phải đoán. */
  function bcVoidSheet(lead, bcId) {
    var bg = document.createElement('div'); bg.className = 'sheet-bg';
    bg.innerHTML = '<div class="sheet"><div class="grab"></div><h3>Đánh dấu bản này là SAI</h3>' +
      '<div class="muted">' + esc(bcId) + '</div>' +
      '<div class="miss" style="margin-top:8px">Bản bị đánh dấu sai sẽ KHÔNG gửi lại được, dưới mọi đường. ' +
      'Nội dung bản cũ giữ nguyên không sửa — khách đã cầm tờ đó rồi.</div>' +
      '<label>Lý do (bắt buộc)</label>' +
      '<textarea id="bv_reason" placeholder="Ví dụ: pax 2 sai phạm vi đã bán; thoả thuận là 1 khách x 1.800.000"></textarea>' +
      '<div class="bcbtns"><button class="btn sec" id="bv_cancel">Huỷ</button>' +
      '<button class="btn danger" id="bv_ok">Đánh dấu sai</button></div></div>';
    document.body.appendChild(bg);
    bg.addEventListener('click', function (e) { if (e.target === bg) bg.remove(); });
    $('#bv_cancel', bg).onclick = function () { bg.remove(); };
    $('#bv_ok', bg).onclick = function () {
      var reason = $('#bv_reason', bg).value.trim();
      if (!reason) { toast('Phải ghi lý do', true); $('#bv_reason', bg).focus(); return; }
      var btn = this; btn.disabled = true; btn.textContent = 'Đang lưu…';
      api('/confirmations/' + encodeURIComponent(bcId), { method: 'POST', body: { status: 'voided', reason: reason } })
        .then(function () { bg.remove(); toast('Đã đánh dấu ' + bcId + ' là bản sai'); bcMount(lead); })
        .catch(function (e) { btn.disabled = false; btn.textContent = 'Đánh dấu sai'; toast(e.message, true); });
    };
  }

  // Sheet điền thông tin: chỉ trường THIẾU bắt buộc, cộng phần "Thêm chi tiết" tuỳ chọn. Không điền sẵn giá trị đoán.
  // saveOnly = true → chỉ LƯU chi tiết buổi làm (PATCH /booking). KHÔNG tạo Booking Confirmation.
  function bcForm(lead, booking, missing, editAll, langDefault, saveOnly) {
    booking = booking || {};
    var lang = (booking.preferred_language === 'en' || booking.preferred_language === 'vi') ? booking.preferred_language : (langDefault === 'en' ? 'en' : 'vi');
    var need = function (k) { return editAll || missing.indexOf(k) >= 0; };
    var f = '';
    if (need('service')) f += '<label>Dịch vụ *</label><select id="b_service">' + opts(state.lists.services, lead.service, true) + '</select>';
    if (need('event_date')) f += '<label>Ngày sự kiện *</label><input id="b_event" type="date" value="' + esc(lead.event_date || '') + '">';
    if (need('ready_time')) f += '<label>Giờ hẹn (giờ cần xong makeup) *</label><input id="b_time" type="time" value="' + esc(booking.ready_time || '') + '">';
    if (need('venue')) f += '<label>Địa điểm *</label><input id="b_venue" value="' + esc(booking.venue || '') + '" placeholder="Tên khách sạn / địa chỉ">';
    // CR-33: KHONG con o "Tong phi" nhap tay. Tong tien chi den tu bang line items ben duoi.
    // Hat giong: KHONG chia nguoc total cu ra don gia (pax=2 / 1.8tr chia ra 900k la mot su that gia).
    //   - chua co line items, pax trong hoac = 1  -> 1 dong service, qty 1, don gia = total cu (dung ve toan hoc)
    //   - chua co line items, pax > 1             -> 1 dong service, qty = pax, don gia DE TRONG, Kay tu dien
    var seedTotal = booking.total_fee != null ? booking.total_fee : lead.expected_revenue;
    var LI = (Array.isArray(booking.line_items) && booking.line_items.length) ? booking.line_items.map(function (it) {
      return { type: it.type, label: it.label, qty: it.qty, unit_price: it.unit_price };
    }) : [{
      type: 'service',
      label: (lead.service || 'Dịch vụ'),
      qty: (booking.pax && booking.pax > 1) ? booking.pax : 1,
      unit_price: (booking.pax && booking.pax > 1) ? '' : (seedTotal == null ? '' : seedTotal)
    }];
    if (need('deposit_mode') || need('deposit_amount')) {
      var dm = booking.deposit_mode || '';
      f += '<label>Cọc *</label><div class="seg" id="b_dm">' +
        '<button type="button" data-v="amount" class="' + (dm === 'amount' ? 'on' : '') + '">Có cọc (số tiền)</button>' +
        '<button type="button" data-v="none" class="' + (dm === 'none' ? 'on' : '') + '">Không cần cọc</button>' +
        '<button type="button" data-v="na" class="' + (dm === 'na' ? 'on' : '') + '">Không áp dụng</button></div>' +
        '<div id="b_depwrap" style="' + (dm === 'amount' ? '' : 'display:none') + '"><label>Số tiền cọc (đ) *</label><input id="b_dep" inputmode="numeric" value="' + (booking.deposit_amount == null ? '' : booking.deposit_amount) + '"></div>';
    }
    var more = '<details' + (editAll ? ' open' : '') + '><summary>Thêm chi tiết cho khách (tuỳ chọn)</summary>' +
      // "Số người" da bi go han: so khach nam trong cot Pax cua tung dong dich vu, khong con la field roi.
      
      '<label>Gồm những gì</label><textarea id="b_inc" placeholder="Makeup + làm tóc cô dâu, touch-up 1 lần, đến tận nơi">' + esc(booking.includes || '') + '</textarea>' +
      '<label>Không gồm</label><input id="b_exc" value="' + esc(booking.excludes || '') + '" placeholder="Phụ kiện, lông mi giả cao cấp…">' +
      '<label>Thanh toán</label><input id="b_pay" value="' + esc(booking.payment_terms || '') + '" placeholder="Còn lại thanh toán tiền mặt / chuyển khoản sau khi xong">' +
      '<label>Ghi chú cho khách</label><textarea id="b_note" placeholder="Vui lòng để mặt sạch, không makeup trước">' + esc(booking.customer_note || '') + '</textarea>' +
      '<label>Lưu ý đặc biệt</label><input id="b_spec" value="' + esc(booking.special_instructions || '') + '"></details>';
    var sheet = document.createElement('div'); sheet.className = 'sheet-bg';
    var langSel = '<label>Ngôn ngữ bản xác nhận</label><div class="seg" id="b_lang">' +
      '<button type="button" data-v="vi" class="' + (lang === 'vi' ? 'on' : '') + '">Tiếng Việt</button>' +
      '<button type="button" data-v="en" class="' + (lang === 'en' ? 'on' : '') + '">English</button></div>';
    sheet.innerHTML = '<div class="sheet"><div class="grab"></div><h3>' + (saveOnly ? 'Sửa chi tiết buổi làm' : (editAll ? 'Sửa chi tiết booking' : (f ? 'Điền phần còn thiếu' : 'Xác nhận thông tin'))) + '</h3>' +
      '<div class="muted">' + esc(lead.customer_name) + ' · ' + esc(lead.service || '') + (lead.event_date ? ' · ' + dmy(lead.event_date) : '') + '</div>' + langSel +
      (saveOnly ? '<div class="muted" style="margin-top:6px">Lưu ở đây chỉ cập nhật thông tin đi làm. KHÔNG gửi gì cho khách, KHÔNG tạo bản xác nhận mới.</div>'
        : (f && !editAll ? '<div class="miss" style="margin-top:6px">Chưa đủ để gửi khách. Không tự điền giá trị đoán.</div>' : '')) + f +
      '<label style="margin-top:10px">Bảng giá *</label><div id="b_li"></div>' + more +
      '<div class="bcbtns"><button class="btn sec" id="b_cancel">Huỷ</button><button class="btn bc" id="b_ok">' + (saveOnly ? 'Lưu chi tiết' : 'Tạo bản xem trước') + '</button></div></div>';
    document.body.appendChild(sheet);
    // ======== Bang line items (CR-20260915-33) ========
    // 1 dong = 1 dich vu + 1 don gia + 1 so luong. Tong tien la o CHI DOC, luon = tong cac dong.
    // Don gia luon nhap DUONG; dau do loai dong quyet dinh. Kay khong bao gio go dau tru.
    var LI_T = { service: 'Dịch vụ', fee: 'Phụ phí', discount: 'Giảm giá' };
    function liSign(t) { return t === 'discount' ? -1 : 1; }
    function liAmt(r) {
      var q = parseInt(String(r.qty || '').replace(/\D/g, ''), 10);
      var u = parseInt(String(r.unit_price || '').replace(/\D/g, ''), 10);
      if (!isFinite(q) || q < 1) q = (r.type === 'service') ? NaN : 1;
      if (!isFinite(q) || !isFinite(u)) return null;
      return liSign(r.type) * q * u;
    }
    function liTotal() {
      var t = 0, ok = true;
      LI.forEach(function (r) { var a = liAmt(r); if (a == null) ok = false; else t += a; });
      return ok && LI.length ? t : null;
    }
    function money(n) { return n == null ? '—' : (n < 0 ? '-' : '') + Math.abs(n).toLocaleString('vi-VN') + ' đ'; }
    function liDraw() {
      var box = $('#b_li', sheet); if (!box) return;
      var h = '';
      LI.forEach(function (r, i) {
        var isSv = r.type === 'service';
        h += '<div style="border:1px solid #E6DED2;border-radius:10px;padding:8px;margin-bottom:8px">' +
          '<div style="display:flex;gap:6px;align-items:center;margin-bottom:6px">' +
            '<select data-li="type" data-i="' + i + '" style="flex:0 0 96px">' +
              ['service', 'fee', 'discount'].map(function (t) { return '<option value="' + t + '"' + (r.type === t ? ' selected' : '') + '>' + LI_T[t] + '</option>'; }).join('') +
            '</select>' +
            '<input data-li="label" data-i="' + i + '" value="' + esc(r.label || '') + '" placeholder="Tên dòng hiện trên card" style="flex:1 1 auto">' +
            (LI.length > 1 ? '<button type="button" class="btn sec sm" data-lidel="' + i + '" title="Xoá dòng">✕</button>' : '') +
          '</div>' +
          '<div style="display:flex;gap:6px;align-items:center">' +
            (isSv
              ? '<input data-li="qty" data-i="' + i + '" inputmode="numeric" value="' + esc(String(r.qty == null ? '' : r.qty)) + '" placeholder="Pax" style="flex:0 0 72px">' +
                '<span class="muted" style="flex:0 0 auto">khách ×</span>'
              : '<input type="hidden" data-li="qty" data-i="' + i + '" value="1">') +
            '<input data-li="unit_price" data-i="' + i + '" inputmode="numeric" value="' + esc(String(r.unit_price == null ? '' : r.unit_price)) + '" placeholder="Đơn giá (số dương)" style="flex:1 1 auto">' +
            '<span style="flex:0 0 auto;font-weight:600;min-width:104px;text-align:right">' + money(liAmt(r)) + '</span>' +
          '</div>' +
        '</div>';
      });
      var gt = liTotal();
      h += '<div style="display:flex;gap:8px;align-items:center;margin-top:4px">' +
             '<button type="button" class="btn sec sm" id="b_liadd">+ Thêm dòng</button>' +
             '<div style="margin-left:auto;text-align:right">' +
               '<div class="muted" style="font-size:12px">TỔNG (tự cộng, không sửa tay)</div>' +
               '<div style="font-weight:700;font-size:18px" id="b_gt">' + money(gt) + '</div>' +
             '</div></div>' +
           (gt == null ? '<div class="miss" style="margin-top:6px">Còn dòng thiếu số. Chưa ra được tổng thì chưa phát hành được.</div>' : '');
      box.innerHTML = h;
      box.querySelectorAll('[data-li]').forEach(function (el) {
        var i = +el.getAttribute('data-i'), key = el.getAttribute('data-li');
        var ev = (el.tagName === 'SELECT') ? 'change' : 'input';
        el.addEventListener(ev, function () {
          LI[i][key] = el.value;
          if (key === 'type' || key === 'qty' || key === 'unit_price') liDraw();
          else { var g = liTotal(); var t = $('#b_gt', sheet); if (t) t.textContent = money(g); }
        });
      });
      var add = $('#b_liadd', sheet);
      if (add) add.onclick = function () { LI.push({ type: 'service', label: '', qty: 1, unit_price: '' }); liDraw(); };
      box.querySelectorAll('[data-lidel]').forEach(function (b) {
        b.onclick = function () { LI.splice(+b.getAttribute('data-lidel'), 1); liDraw(); };
      });
    }
    liDraw();

    var dmv = booking.deposit_mode || '';
    sheet.querySelectorAll('#b_lang button').forEach(function (b) { b.onclick = function () { lang = b.getAttribute('data-v'); sheet.querySelectorAll('#b_lang button').forEach(function (x) { x.className = x === b ? 'on' : ''; }); }; });
    sheet.querySelectorAll('#b_dm button').forEach(function (b) { b.onclick = function () { dmv = b.getAttribute('data-v'); sheet.querySelectorAll('#b_dm button').forEach(function (x) { x.className = x === b ? 'on' : ''; }); $('#b_depwrap', sheet).style.display = dmv === 'amount' ? '' : 'none'; }; });
