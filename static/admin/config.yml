backend:
  name: github
  repo: Vannhattan87/kinkay-site
  branch: main
  base_url: https://kinkay-site.pages.dev

locale: 'vi'
site_url: https://kinkay.vn
display_url: https://kinkay.vn
logo_url: https://kinkay.vn/apple-touch-icon.png

media_folder: "static/assets/uploads"
public_folder: "/assets/uploads"

# 28/07/2026: bắt buộc slug ASCII không dấu. Trước đây CMS lấy thẳng tiêu đề tiếng Việt
# làm tên file, sinh ra URL kiểu /blog/layout-trang-điểm-mùa-đông-... — sai chuẩn sitemap
# và Google Search Console báo lỗi. clean_accents khử dấu, encoding ascii chặn ký tự lạ.
slug:
  encoding: "ascii"
  clean_accents: true
  sanitize_replacement: "-"

collections:
  - name: "blog"
    label: "Bài viết Blog"
    label_singular: "bài viết"
    folder: "content/blog"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Tiêu đề", name: "title", widget: "string" }
      - { label: "Ngày đăng", name: "date", widget: "datetime", format: "YYYY-MM-DD", time_format: false }
      - { label: "Ảnh cover", name: "cover", widget: "image", media_folder: "/static/assets/uploads", public_folder: "/assets/uploads", hint: "Ảnh ngang đẹp nhất của bài — hiện trên trang Blog và khi share link" }
      - { label: "Mô tả ngắn", name: "excerpt", widget: "string", hint: "1-2 câu, hiện dưới tiêu đề trên trang Blog" }
      - { label: "Nội dung", name: "body", widget: "markdown", hint: "Viết như nói chuyện với khách. Dùng nút H2 cho tiêu đề mục." }

  - name: "services"
    label: "Dịch vụ & Bảng giá"
    files:
      - name: "services"
        label: "Dịch vụ và giá"
        file: "content/services.json"
        fields:
          - { label: "Hiện giá trên website", name: "show_prices", widget: "boolean", default: true, hint: "Tắt là toàn bộ dòng giá biến mất, chỉ còn nút nhắn Kay. Bật/tắt được bất cứ lúc nào, không cần sửa code." }
          - { label: "Ghi chú dưới bảng giá", name: "currency_note", widget: "string", required: false }
          - { label: "Ghi chú địa điểm", name: "location_note", widget: "text", required: false }
          - { label: "Bridal — giá từ", name: "bridal_from", widget: "string", hint: "Dùng ở trang Lịch cưới. Ví dụ: 3.000.000đ" }
          - { label: "Bridal — giá đến", name: "bridal_to", widget: "string" }
          - { label: "Giá trial", name: "trial_price", widget: "string" }
          - label: "Các dịch vụ"
            name: "items"
            widget: "list"
            label_singular: "dịch vụ"
            allow_add: true
            collapsed: true
            summary: "{{fields.name}} — {{fields.price}}"
            fields:
              - { label: "Tên dịch vụ", name: "name", widget: "string" }
              - { label: "Mô tả", name: "desc", widget: "text" }
              - { label: "Giá", name: "price", widget: "string", hint: "Gõ nguyên văn như muốn hiện trên web. Ví dụ: Từ 1.200.000đ" }

  - name: "settings"
    label: "Portfolio (ảnh)"
    files:
      - name: "gallery"
        label: "Ảnh Portfolio theo nhóm"
        file: "content/gallery.json"
        fields:
          - label: "Các nhóm"
            name: "categories"
            widget: "list"
            allow_add: true
            collapsed: true
            summary: "{{fields.label_vi}}"
            fields:
              - { label: "Slug (không đổi)", name: "slug", widget: "string" }
              - { label: "Tên tiếng Việt", name: "label_vi", widget: "string" }
              - { label: "Tên tiếng Anh", name: "label_en", widget: "string" }
              - label: "Ảnh trong nhóm"
                name: "images"
                widget: "image"
                multiple: true
                media_folder: "/static/assets/img"
                public_folder: "/assets/img"
                hint: "Bấm để chọn NHIỀU ảnh cùng lúc (kéo-thả cũng được). Ảnh đầu tiên là ảnh mặt tiền của nhóm. Kéo để đổi thứ tự."
      - name: "videos"
        label: "Video Behind the Glam"
        file: "content/videos.json"
        fields:
          - label: "Danh sách video"
            name: "videos"
            widget: "list"
            label_singular: "video"
            allow_add: true
            max: 10
            summary: "{{fields.url}}"
            fields:
              - label: "Video (mp4)"
                name: "url"
                widget: "file"
                media_folder: "/static/assets/uploads"
                public_folder: "/assets/uploads"
                hint: "Bấm để upload video mp4 (tối đa 10). Nên dùng clip ngắn, nhẹ (dưới ~20MB). Kéo thả để đổi thứ tự, thùng rác để xóa."
